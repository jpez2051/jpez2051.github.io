<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#b95c3d" />
<title>Action 4 Animals Foster Kitten Care</title>
<style>
:root{--brand:#b95c3d;--brand2:#d77a56;--ink:#47271e;--muted:#8a675b;--bg:#fff8f3;--card:#fff;--line:#f0d9cf;--soft:#fcedE6;--ok:#2f7d4c;--warn:#b66a15;--danger:#b93d3d;--shadow:0 8px 26px rgba(84,42,25,.10);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
body{padding-bottom:94px}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 15px;box-shadow:0 5px 20px rgba(90,37,20,.18)}.header-row{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand small{display:block;opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.brand strong{font-size:19px}.icon-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:9px 11px}.container{max-width:760px;margin:0 auto;padding:18px 14px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}.hero h1{font-size:24px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:14px}.date-pill{background:var(--card);border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--muted);font-size:12px;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-head h2{font-size:16px;margin:0}.subtle{color:var(--muted);font-size:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:var(--soft);color:var(--brand)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.btn.small{padding:7px 10px;font-size:12px}.empty{padding:24px 14px;text-align:center;color:var(--muted)}.empty .emoji{font-size:34px;margin-bottom:8px}.status-list{display:grid;gap:10px}.status-item{border:1px solid var(--line);border-radius:15px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f6d8c8,#f9eee8);display:grid;place-items:center;font-size:23px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.status-item h3{margin:0 0 3px;font-size:15px}.status-line{font-size:12px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}.badge.ok{background:#e9f6ee;color:var(--ok)}.badge.warn{background:#fff4e5;color:var(--warn)}.badge.danger{background:#fff0f0;color:var(--danger)}.badge.neutral{background:#f6f0ed;color:var(--muted)}.action-stack{display:grid;gap:6px;justify-items:end}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 6px;text-align:center;color:var(--ink)}.quick-btn span{display:block;font-size:23px;margin-bottom:4px}.quick-btn b{font-size:11px}.kitten-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.kitten-tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px;text-align:left}.kitten-tile .top{display:flex;align-items:center;gap:10px}.kitten-tile h3{font-size:15px;margin:0}.kitten-tile p{font-size:11px;color:var(--muted);margin:3px 0 0}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{background:#fff9f6;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.metric b{display:block;font-size:18px}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.timeline{display:grid;gap:9px}.event{display:grid;grid-template-columns:42px 1fr auto;gap:10px;border-bottom:1px solid #f4e5df;padding:9px 0}.event:last-child{border:0}.event-icon{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.event h4{margin:0 0 3px;font-size:13px}.event p{margin:0;color:var(--muted);font-size:12px}.event time{font-size:10px;color:var(--muted);white-space:nowrap}.section-title{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.09em;margin:14px 0 8px}.med-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:8px}.med-row h4{margin:0 0 3px;font-size:13px}.med-row p{margin:0;color:var(--muted);font-size:11px}.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 74px 1fr;align-items:end}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px}.nav-btn span{display:block;font-size:21px;margin-bottom:2px}.nav-btn.active{color:var(--brand);font-weight:800}.fab{width:58px;height:58px;border-radius:50%;border:5px solid var(--bg);background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(121,50,30,.25);justify-self:center;margin-top:-29px}.overlay{position:fixed;z-index:100;inset:0;background:rgba(43,24,17,.52);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:760px;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head h2{margin:0;font-size:19px}.close{border:0;background:#f5eeea;width:36px;height:36px;border-radius:50%;font-size:19px}.form-grid{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #e7cec2;border-radius:12px;background:#fffaf8;padding:11px 12px;color:var(--ink);outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(185,92,61,.09)}.choice-row{display:flex;gap:7px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:12px}.choice.selected{background:var(--brand);border-color:var(--brand);color:#fff}.sheet-actions{display:flex;gap:9px;margin-top:16px}.sheet-actions .btn{flex:1}.notice{background:#fff7e8;border:1px solid #f2deb3;color:#7b571c;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:12px}.danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:200;left:50%;bottom:104px;transform:translateX(-50%);background:#36221c;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;box-shadow:var(--shadow)}@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:86vh}.quick-grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header><div class="header-row"><div class="brand"><small>Action 4 Animals</small><strong>🐾 Foster Kitten Care</strong></div><button class="icon-btn" id="exportBtn" title="Export backup">⇩ Backup</button></div></header>
<main class="container" id="app"></main>
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="today"><span>🏠</span>Today</button>
  <button class="nav-btn" data-view="kittens"><span>🐱</span>Kittens</button>
  <button class="fab" id="quickFab" aria-label="Log care">+</button>
  <button class="nav-btn" data-view="alerts"><span>🔔</span>Alerts</button>
</nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY='a4a-kitten-care-v3';
const state=loadState();
let activeView='today';
let activeKittenId=null;
let logType='feeding';

function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function nowISO(){return new Date().toISOString()}
function todayLabel(){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date())}
function fmtTime(iso){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso))}
function fmtDate(iso){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(iso))}
function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function ageText(dob){if(!dob)return 'Age unknown';const birth=new Date(dob+'T12:00:00');const days=Math.max(0,Math.floor((Date.now()-birth.getTime())/86400000));if(days<14)return days+' day'+(days===1?'':'s')+' old';const weeks=Math.floor(days/7);return weeks+' wk'+(weeks===1?'':'s')+' '+(days%7)+' d'}
function getKitten(id){return state.kittens.find(k=>k.id===id)}
function eventsFor(id,type){return state.events.filter(e=>e.kittenId===id&&(!type||e.type===type)).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function lastEvent(id,type){return eventsFor(id,type)[0]||null}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.kittens)&&Array.isArray(parsed.events))return parsed}}catch(e){}return {version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),1800)}
function hrs(ms){return ms/3600000}
function timeUntil(iso){const diff=new Date(iso)-Date.now();const abs=Math.abs(diff);const h=Math.floor(abs/3600000),m=Math.floor((abs%3600000)/60000);const txt=(h?h+'h ':'')+m+'m';return diff<0?txt+' overdue':'in '+txt}
function nextFeeding(k){const last=lastEvent(k.id,'feeding');if(!last)return new Date().toISOString();return new Date(new Date(last.ts).getTime()+(Number(k.feedingIntervalHours)||4)*3600000).toISOString()}
function medStatus(k,med){const logs=state.events.filter(e=>e.kittenId===k.id&&e.type==='medication'&&e.data.medId===med.id).sort((a,b)=>new Date(b.ts)-new Date(a.ts));const last=logs[0];const base=last?new Date(last.ts).getTime():new Date(med.startAt||Date.now()).getTime()-(Number(med.intervalHours)||12)*3600000;const next=new Date(base+(Number(med.intervalHours)||12)*3600000).toISOString();return {last,next,overdue:new Date(next)<=new Date()}}
function latestWeight(k){const e=lastEvent(k.id,'weight');return e?Number(e.data.grams):null}
function previousWeight(k){const es=eventsFor(k.id,'weight');return es[1]?Number(es[1].data.grams):null}
function kittenAlerts(k){const a=[];const nf=nextFeeding(k);if(new Date(nf)<=new Date())a.push({kind:'feeding',level:'warn',text:'Feeding '+timeUntil(nf)});const w=latestWeight(k),pw=previousWeight(k);if(w!=null&&pw!=null&&w<pw)a.push({kind:'weight',level:'danger',text:'Weight down '+(pw-w)+'g'});(k.medications||[]).forEach(m=>{const s=medStatus(k,m);if(s.overdue)a.push({kind:'medication',level:'danger',text:m.name+' '+timeUntil(s.next),med:m})});return a}

function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));const app=document.getElementById('app');if(activeView==='today')app.innerHTML=todayView();if(activeView==='kittens')app.innerHTML=kittensView();if(activeView==='alerts')app.innerHTML=alertsView();if(activeView==='profile')app.innerHTML=profileView(activeKittenId);bindDynamic()}
function todayView(){const kittens=state.kittens;return `<div class="hero"><div><h1>Today</h1><p>${kittens.length?`Care overview for ${kittens.length} kitten${kittens.length===1?'':'s'}`:'Set up your first foster kitten'}</p></div><div class="date-pill">${todayLabel()}</div></div>
<div class="card"><div class="card-head"><h2>Who needs care now?</h2><span class="subtle">Live from your logs</span></div>${kittens.length?`<div class="status-list">${kittens.map(statusCard).join('')}</div>`:`<div class="empty"><div class="emoji">🐱</div><b>No kittens yet</b><p>Add a kitten to start tracking feedings, weight and medications.</p><button class="btn primary" data-action="add-kitten">+ Add kitten</button></div>`}</div>
<div class="card"><div class="card-head"><h2>Quick log</h2><span class="subtle">Two-tap care entry</span></div><div class="quick-grid">${[['feeding','🍼','Feeding'],['weight','⚖️','Weight'],['medication','💊','Medication'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div></div>
${recentEventsCard()}`}
function statusCard(k){const alerts=kittenAlerts(k),w=latestWeight(k),feed=lastEvent(k.id,'feeding'),top=alerts[0];return `<div class="status-item" data-open-kitten="${k.id}"><div class="avatar">🐱</div><div><h3>${escapeHTML(k.name)}</h3><div class="status-line">${w!=null?`${w}g`:'No weight yet'} · ${ageText(k.dob)}</div><div class="status-line">${feed?`Last fed ${fmtTime(feed.ts)}${feed.data.amount?` · ${escapeHTML(feed.data.amount)} ${escapeHTML(feed.data.unit||'mL')}`:''}`:'No feeding logged'}</div>${top?`<div style="margin-top:6px"><span class="badge ${top.level}">${top.level==='danger'?'⚠':'⏱'} ${escapeHTML(top.text)}</span></div>`:`<div style="margin-top:6px"><span class="badge ok">✓ Current</span></div>`}</div><div class="action-stack">${top?`<button class="btn ghost small" data-log="${top.kind}" data-kitten="${k.id}" ${top.med?`data-med="${top.med.id}"`:''}>Log</button>`:'<span class="badge ok">✓</span>'}</div></div>`}
function recentEventsCard(){const es=[...state.events].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,6);return `<div class="card"><div class="card-head"><h2>Recent care</h2><span class="subtle">Latest activity</span></div>${es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:`<div class="empty">No care logged yet.</div>`}</div>`}
function kittensView(){return `<div class="hero"><div><h1>Kittens</h1><p>Profiles and care plans</p></div><button class="btn primary" data-action="add-kitten">+ Add</button></div>${state.kittens.length?`<div class="kitten-grid">${state.kittens.map(k=>`<button class="kitten-tile" data-open-kitten="${k.id}"><div class="top"><div class="avatar">🐱</div><div><h3>${escapeHTML(k.name)}</h3><p>${escapeHTML(k.litter||'No litter')} · ${ageText(k.dob)}</p></div></div><div class="metric-row"><div class="metric"><b>${latestWeight(k)??'—'}</b><span>grams</span></div><div class="metric"><b>${eventsFor(k.id,'feeding').filter(e=>sameDay(e.ts,new Date())).length}</b><span>feeds today</span></div><div class="metric"><b>${(k.medications||[]).length}</b><span>meds</span></div></div></button>`).join('')}</div>`:`<div class="card"><div class="empty"><div class="emoji">🐾</div><b>Your foster roster is empty.</b><p>Add the first kitten when an intake arrives.</p></div></div>`}`}
function profileView(id){const k=getKitten(id);if(!k)return kittensView();const w=latestWeight(k),pw=previousWeight(k),gain=w!=null&&pw!=null?w-pw:null;const meds=k.medications||[];const es=eventsFor(k.id).slice(0,20);return `<div class="hero"><div><button class="btn secondary small" data-action="back-kittens">← Kittens</button><h1 style="margin-top:10px">${escapeHTML(k.name)}</h1><p>${ageText(k.dob)}${k.litter?' · '+escapeHTML(k.litter):''}${k.sex?' · '+escapeHTML(k.sex):''}</p></div><div class="avatar" style="width:60px;height:60px;font-size:29px">🐱</div></div>
<div class="card"><div class="card-head"><h2>At a glance</h2><button class="btn secondary small" data-action="edit-kitten" data-kitten="${k.id}">Edit</button></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${gain==null?'—':(gain>0?'+':'')+gain}</b><span>last change</span></div><div class="metric"><b>${k.feedingIntervalHours||4}h</b><span>feed interval</span></div></div><div class="quick-grid">${[['feeding','🍼','Feed'],['weight','⚖️','Weight'],['medication','💊','Meds'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}" data-kitten="${k.id}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div></div>
<div class="card"><div class="card-head"><h2>Medication plan</h2><button class="btn ghost small" data-action="add-med" data-kitten="${k.id}">+ Medication</button></div>${meds.length?meds.map(m=>{const s=medStatus(k,m);return `<div class="med-row"><div><h4>💊 ${escapeHTML(m.name)}</h4><p>${escapeHTML(m.dose)} ${escapeHTML(m.unit)} · ${escapeHTML(m.route)} · every ${m.intervalHours}h</p><p>${s.last?'Last '+fmtTime(s.last.ts):'No dose logged'} · <b>${timeUntil(s.next)}</b></p></div><button class="btn ${s.overdue?'primary':'ghost'} small" data-log="medication" data-kitten="${k.id}" data-med="${m.id}">${s.overdue?'Give':'Log'}</button></div>`}).join(''):`<div class="empty">No medications assigned.</div>`}</div>
<div class="card"><div class="card-head"><h2>Care timeline</h2><span class="subtle">Newest first</span></div>${es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:`<div class="empty">No care events yet.</div>`}</div>`}
function alertsView(){const all=state.kittens.flatMap(k=>kittenAlerts(k).map(a=>({k,a})));return `<div class="hero"><div><h1>Alerts</h1><p>Overdue care and trends needing attention</p></div><div class="date-pill">${all.length} active</div></div><div class="card">${all.length?`<div class="status-list">${all.map(({k,a})=>`<div class="status-item"><div class="avatar">${a.kind==='feeding'?'🍼':a.kind==='medication'?'💊':'⚖️'}</div><div><h3>${escapeHTML(k.name)}</h3><div class="status-line">${escapeHTML(a.text)}</div><div style="margin-top:6px"><span class="badge ${a.level}">${a.kind==='weight'?'Review trend':'Care due'}</span></div></div><button class="btn ghost small" ${a.kind==='weight'?`data-open-kitten="${k.id}"`:`data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}`}>Open</button></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>No active alerts</b><p>Nothing is currently overdue based on the care plans in this device.</p></div>`}</div><div class="notice">Weight alerts in this prototype only flag a drop from the previous recorded weight. Organization-specific clinical thresholds will be configurable before rollout.</div>`}
function eventRow(e){const k=getKitten(e.kittenId);const meta=eventMeta(e);return `<div class="event"><div class="event-icon">${meta.icon}</div><div><h4>${escapeHTML(k?.name||'Kitten')} · ${meta.title}</h4><p>${escapeHTML(meta.detail)}</p></div><time>${sameDay(e.ts,new Date())?fmtTime(e.ts):fmtDate(e.ts)}</time></div>`}
function eventMeta(e){const d=e.data||{};switch(e.type){case'feeding':return{icon:'🍼',title:'Feeding',detail:`${d.amount||'—'} ${d.unit||'mL'} ${d.food?d.food:''}${d.method?' · '+d.method:''}${d.appetite?' · '+d.appetite:''}`};case'weight':return{icon:'⚖️',title:'Weight',detail:`${d.grams} g`};case'medication':return{icon:'💊',title:'Medication',detail:`${d.name||'Medication'} · ${d.dose||''} ${d.unit||''} · ${d.status||'given'}`};case'potty':return{icon:'🚽',title:'Potty',detail:`${d.urine?'Urine ✓':'No urine'} · Stool: ${d.stool||'not observed'}${d.stimulated?' · stimulated':''}`};case'health':return{icon:'🌡️',title:'Health check',detail:d.note||'Health observation'};default:return{icon:'📝',title:'Note',detail:d.note||''}}}
function sameDay(iso,date){const a=new Date(iso);return a.getFullYear()===date.getFullYear()&&a.getMonth()===date.getMonth()&&a.getDate()===date.getDate()}

function bindDynamic(){document.querySelectorAll('[data-action="add-kitten"]').forEach(b=>b.onclick=()=>openKittenModal());document.querySelectorAll('[data-action="edit-kitten"]').forEach(b=>b.onclick=e=>openKittenModal(getKitten(e.currentTarget.dataset.kitten)));document.querySelectorAll('[data-action="back-kittens"]').forEach(b=>b.onclick=()=>{activeView='kittens';render()});document.querySelectorAll('[data-action="add-med"]').forEach(b=>b.onclick=e=>openMedModal(getKitten(e.currentTarget.dataset.kitten)));document.querySelectorAll('[data-open-kitten]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-log]'))return;activeKittenId=e.currentTarget.dataset.openKitten;activeView='profile';render()});document.querySelectorAll('[data-log]').forEach(b=>b.onclick=e=>openLogModal(e.currentTarget.dataset.log,e.currentTarget.dataset.kitten||null,e.currentTarget.dataset.med||null))}

document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});document.getElementById('quickFab').onclick=()=>openLogModal('feeding');document.getElementById('exportBtn').onclick=exportBackup;
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function showSheet(title,body){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" id="closeSheet">×</button></div>${body}</div></div>`;document.getElementById('closeSheet').onclick=closeModal;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()}}
function kittenOptions(selected){return state.kittens.map(k=>`<option value="${k.id}" ${k.id===selected?'selected':''}>${escapeHTML(k.name)}</option>`).join('')}
function openKittenModal(k=null){showSheet(k?'Edit kitten':'Add kitten',`<form id="kittenForm" class="form-grid"><input type="hidden" name="id" value="${k?.id||''}"><div class="field"><label>Name *</label><input name="name" required value="${escapeHTML(k?.name||'')}" placeholder="e.g. Luna"></div><div class="two"><div class="field"><label>Date of birth</label><input type="date" name="dob" value="${k?.dob||''}"></div><div class="field"><label>Sex</label><select name="sex"><option value="">Unknown</option><option ${k?.sex==='Female'?'selected':''}>Female</option><option ${k?.sex==='Male'?'selected':''}>Male</option></select></div></div><div class="field"><label>Litter / group</label><input name="litter" value="${escapeHTML(k?.litter||'')}" placeholder="e.g. Volcano Babies"></div><div class="two"><div class="field"><label>Intake weight (g)</label><input type="number" min="0" step="1" name="intakeWeight" value="${k?.intakeWeight||''}"></div><div class="field"><label>Feed every (hours)</label><input type="number" min="1" max="24" step="0.5" name="feedingIntervalHours" value="${k?.feedingIntervalHours||4}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">${k?'Save changes':'Add kitten'}</button></div>${k?`<div class="danger-zone"><button type="button" class="btn danger" id="deleteKitten">Remove kitten from this device</button></div>`:''}</form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('kittenForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=f.get('id')||uid('kitten');const existing=getKitten(id);const item={...(existing||{}),id,name:String(f.get('name')).trim(),dob:f.get('dob'),sex:f.get('sex'),litter:String(f.get('litter')).trim(),intakeWeight:Number(f.get('intakeWeight'))||null,feedingIntervalHours:Number(f.get('feedingIntervalHours'))||4,medications:existing?.medications||[]};if(existing)Object.assign(existing,item);else{state.kittens.push(item);if(item.intakeWeight)state.events.push({id:uid('evt'),kittenId:id,type:'weight',ts:nowISO(),data:{grams:item.intakeWeight,source:'intake'}})}saveState();closeModal();activeKittenId=id;activeView='profile';render();toast(existing?'Kitten updated':'Kitten added')};if(k)document.getElementById('deleteKitten').onclick=()=>{if(confirm(`Remove ${k.name} and all local care logs?`)){state.kittens=state.kittens.filter(x=>x.id!==k.id);state.events=state.events.filter(x=>x.kittenId!==k.id);saveState();closeModal();activeView='kittens';render();toast('Kitten removed')}}}
function openMedModal(k){if(!k)return;showSheet('Add medication',`<form id="medForm" class="form-grid"><div class="notice">This prototype stores the medication plan on this device. In the Firebase rollout, coordinator/admin permissions will control medication plan edits.</div><div class="field"><label>Medication *</label><input name="name" required placeholder="e.g. Amoxicillin"></div><div class="two"><div class="field"><label>Dose *</label><input name="dose" required inputmode="decimal" placeholder="0.4"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>mg</option><option>tablet</option><option>drop</option></select></div></div><div class="two"><div class="field"><label>Route</label><select name="route"><option>Oral</option><option>Topical</option><option>Eye</option><option>Ear</option><option>Other</option></select></div><div class="field"><label>Every (hours)</label><input type="number" min="1" max="168" name="intervalHours" value="12"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Add medication</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('medForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);k.medications=k.medications||[];k.medications.push({id:uid('med'),name:String(f.get('name')).trim(),dose:String(f.get('dose')).trim(),unit:f.get('unit'),route:f.get('route'),intervalHours:Number(f.get('intervalHours'))||12,startAt:nowISO()});saveState();closeModal();render();toast('Medication added')}}
function openLogModal(type='feeding',kittenId=null,medId=null){if(!state.kittens.length){openKittenModal();return}logType=type;const selected=kittenId||activeKittenId||state.kittens[0].id;const k=getKitten(selected);const bodyByType={feeding:feedingForm(k),weight:weightForm(k),medication:medForm(k,medId),potty:pottyForm(k),note:noteForm(k),health:healthForm(k)};showSheet('Log '+({feeding:'feeding',weight:'weight',medication:'medication',potty:'potty',note:'note',health:'health check'}[type]),`<form id="logForm" class="form-grid"><div class="field"><label>Kitten *</label><select name="kittenId" id="logKitten">${kittenOptions(selected)}</select></div><div id="typeFields">${bodyByType[type]}</div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save log</button></div></form>`);document.getElementById('cancelForm').onclick=closeModal;document.getElementById('logForm').onsubmit=submitLog;document.getElementById('logKitten').onchange=e=>{const nk=getKitten(e.target.value);document.getElementById('typeFields').innerHTML=type==='feeding'?feedingForm(nk):type==='weight'?weightForm(nk):type==='medication'?medForm(nk,null):type==='potty'?pottyForm(nk):type==='note'?noteForm(nk):healthForm(nk)};document.getElementById('logForm').onsubmit=submitLog;document.getElementById('logForm').onsubmit=submitLog}
function feedingForm(){return `<div class="two"><div class="field"><label>Amount</label><input name="amount" inputmode="decimal" placeholder="8"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div></div><div class="field"><label>Food</label><input name="food" placeholder="KMR formula, wet food, gruel..."></div><div class="two"><div class="field"><label>Method</label><select name="method"><option>Bottle</option><option>Syringe</option><option>Gruel</option><option>Wet food</option><option>Dry food</option><option>Nursing</option><option>Other</option></select></div><div class="field"><label>Appetite</label><select name="appetite"><option>Great</option><option selected>Normal</option><option>Poor</option><option>Refused</option></select></div></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional feeding notes"></textarea></div>`}
function weightForm(k){return `<div class="field"><label>Weight (grams) *</label><input type="number" min="1" step="1" name="grams" required value="${latestWeight(k)||''}" placeholder="312"></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional weight note"></textarea></div>`}
function medForm(k,medId){const meds=k?.medications||[];if(!meds.length)return `<div class="notice">${escapeHTML(k?.name||'This kitten')} has no medication plan yet. Add one from the kitten profile first.</div><input type="hidden" name="noMed" value="1">`;return `<div class="field"><label>Medication *</label><select name="medId">${meds.map(m=>`<option value="${m.id}" ${m.id===medId?'selected':''}>${escapeHTML(m.name)} · ${escapeHTML(m.dose)} ${escapeHTML(m.unit)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option value="given">Given</option><option value="skipped">Skipped</option><option value="unable">Unable to give</option></select></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional medication note"></textarea></div>`}
function pottyForm(){return `<div class="two"><div class="field"><label>Urinated?</label><select name="urine"><option value="yes">Yes</option><option value="no">No</option><option value="unknown">Not observed</option></select></div><div class="field"><label>Stool</label><select name="stool"><option>Normal</option><option>Soft</option><option>Diarrhea</option><option>Hard</option><option>Abnormal color</option><option>Not observed</option></select></div></div><div class="field"><label>Stimulated?</label><select name="stimulated"><option value="yes">Yes</option><option value="no">No</option></select></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Optional potty notes"></textarea></div>`}
function noteForm(){return `<div class="field"><label>Care note *</label><textarea name="note" required placeholder="Behavior, handoff information, supplies, concerns..."></textarea></div>`}
function healthForm(){return `<div class="field"><label>Observation *</label><textarea name="note" required placeholder="Energy, breathing, eyes/nose, temperature if instructed, other observations..."></textarea></div><div class="notice">This log is for recording observations, not diagnosing illness. Follow Action 4 Animals' escalation protocol for urgent concerns.</div>`}
function submitLog(e){e.preventDefault();const f=new FormData(e.currentTarget),kittenId=f.get('kittenId'),k=getKitten(kittenId);if(!k)return;let data={};if(logType==='feeding')data={amount:String(f.get('amount')||'').trim(),unit:f.get('unit'),food:String(f.get('food')||'').trim(),method:f.get('method'),appetite:f.get('appetite'),note:String(f.get('note')||'').trim()};if(logType==='weight')data={grams:Number(f.get('grams')),note:String(f.get('note')||'').trim()};if(logType==='medication'){if(f.get('noMed')){closeModal();activeKittenId=k.id;activeView='profile';render();toast('Add a medication plan first');return}const med=(k.medications||[]).find(m=>m.id===f.get('medId'));if(!med)return;data={medId:med.id,name:med.name,dose:med.dose,unit:med.unit,route:med.route,status:f.get('status'),note:String(f.get('note')||'').trim()}}if(logType==='potty')data={urine:f.get('urine')==='yes',urineStatus:f.get('urine'),stool:f.get('stool'),stimulated:f.get('stimulated')==='yes',note:String(f.get('note')||'').trim()};if(logType==='note'||logType==='health')data={note:String(f.get('note')||'').trim()};state.events.push({id:uid('evt'),kittenId,type:logType,ts:nowISO(),data});saveState();closeModal();render();toast('Care logged')}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a4a-kitten-care-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
render();
})();
</script>
</body>
</html>
