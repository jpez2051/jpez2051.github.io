<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a83">
<title>Action 4 Animals Foster Kitten Care</title>
<style>
:root{--navy:#102a83;--navy2:#193ca8;--pink:#ec155d;--ink:#18223b;--muted:#6c7485;--bg:#f5f7fd;--card:#fff;--line:#dfe5f3;--soft:#eef2ff;--ok:#287a4d;--warn:#aa6513;--danger:#c92f49;--shadow:0 8px 26px rgba(16,42,131,.10);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}body{padding-bottom:98px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 13px;box-shadow:0 5px 20px rgba(9,28,98,.22)}.header-row{max-width:840px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;opacity:.82;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.brand strong{font-size:18px}.brand-accent{color:#ff6f9d}.head-actions{display:flex;gap:7px}.icon-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff;border-radius:12px;padding:8px 9px;font-weight:750}.container{max-width:840px;margin:0 auto;padding:16px 13px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.hero h1{font-size:23px;margin:0 0 4px;color:var(--navy)}.hero p{margin:0;color:var(--muted);font-size:13px}.date-pill{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--navy);font-size:11px;font-weight:750;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin:0 0 13px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px}.card-head h2{font-size:16px;margin:0;color:var(--navy)}.subtle{color:var(--muted);font-size:11px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--pink);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.ghost{background:var(--soft);color:var(--navy)}.btn.danger{background:#fff0f2;color:var(--danger);border:1px solid #f4c8d0}.btn.small{padding:7px 9px;font-size:11px}.empty{padding:22px 13px;text-align:center;color:var(--muted)}.empty .emoji{font-size:33px;margin-bottom:7px}.notice{background:#fff7e8;border:1px solid #f2deb3;color:#7b571c;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}
.status-list{display:grid;gap:9px}.status-item{border:1px solid var(--line);border-radius:15px;padding:11px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#edf1ff,#ffe8f1);display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.large{width:72px;height:72px;font-size:30px}.status-item h3{margin:0 0 3px;font-size:14px}.status-line{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.litter-chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;background:var(--soft);color:var(--navy);font-size:9px;font-weight:800;margin-top:5px}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.ok{background:#e9f6ee;color:var(--ok)}.badge.warn{background:#fff4e5;color:var(--warn)}.badge.danger{background:#fff0f2;color:var(--danger)}.action-stack{display:grid;gap:5px;justify-items:end}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 5px;text-align:center;color:var(--navy)}.quick-btn span{display:block;font-size:22px;margin-bottom:3px}.quick-btn b{font-size:10px}.litter-section{margin-bottom:16px}.litter-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px}.litter-head h2{margin:0;font-size:15px;color:var(--navy)}.litter-count{font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.kitten-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}.kitten-tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:left}.kitten-tile .top{display:flex;align-items:center;gap:9px}.kitten-tile h3{font-size:14px;margin:0}.kitten-tile p{font-size:10px;color:var(--muted);margin:3px 0 0}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.metric{background:#f8f9ff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.metric b{display:block;font-size:17px;color:var(--navy)}.metric span{font-size:9px;color:var(--muted);text-transform:uppercase}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;border-bottom:1px solid #edf0f7;padding:8px 0}.event:last-child{border:0}.event-icon{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.event h4{margin:0 0 3px;font-size:12px}.event p{margin:0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.event time{font-size:9px;color:var(--muted);white-space:nowrap}.med-row{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.med-row h4{margin:0 0 3px;font-size:12px}.med-row p{margin:0;color:var(--muted);font-size:10px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary-box{border:1px solid var(--line);border-radius:14px;padding:11px;background:#f9faff}.summary-box b{display:block;font-size:18px;color:var(--navy)}.summary-box span{font-size:10px;color:var(--muted)}.handoff{white-space:pre-wrap;background:#f9faff;border:1px dashed #cbd4ec;border-radius:13px;padding:11px;font-size:12px;line-height:1.45}.profile-photo-wrap{display:flex;align-items:flex-start;gap:12px}.photo-preview{width:74px;height:74px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:28px;flex:none}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-help{font-size:10px;color:var(--muted);line-height:1.35}.identity-grid,.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.field{min-width:0}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:0 0 5px}.field input,.field select,.field textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid #ced6eb;border-radius:12px;background:#fbfcff;padding:10px 11px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;gap:11px}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}.danger-zone{margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:9px;padding:5px}.nav-btn span{display:block;font-size:20px;margin-bottom:2px}.nav-btn.active{color:var(--navy);font-weight:800}.fab{width:56px;height:56px;border-radius:50%;border:5px solid var(--bg);background:var(--pink);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(236,21,93,.28);justify-self:center;margin-top:-28px}.overlay{position:fixed;z-index:100;inset:0;background:rgba(10,21,65,.52);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:840px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:17px 15px calc(18px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-head h2{margin:0;font-size:18px;color:var(--navy)}.close{border:0;background:#eef1f9;width:35px;height:35px;border-radius:50%;font-size:18px;color:var(--navy)}.toast{position:fixed;z-index:200;left:50%;bottom:106px;transform:translateX(-50%);background:#17245d;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px}
@media(max-width:500px){.identity-grid,.two.mobile-stack{grid-template-columns:1fr}.status-item{grid-template-columns:auto minmax(0,1fr)}.status-item .action-stack{grid-column:2;justify-items:start}.profile-photo-wrap{flex-direction:column}.photo-preview{width:84px;height:84px}}
@media(max-width:370px){.two{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}.quick-grid{grid-template-columns:repeat(6,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="header-row"><div class="brand"><small>Action 4 Animals Hawaii</small><strong>🐾 Foster Kitten <span class="brand-accent">Care</span></strong></div><div class="head-actions"><button class="icon-btn" id="backupBtn">⇩ Backup</button><button class="icon-btn" id="settingsBtn">⚙</button></div></div></header>
<main class="container" id="app"></main>
<nav class="bottom-nav"><button class="nav-btn active" data-view="today"><span>🏠</span>Today</button><button class="nav-btn" data-view="kittens"><span>🐱</span>Kittens</button><button class="fab" id="quickFab">+</button><button class="nav-btn" data-view="alerts"><span>🔔</span>Alerts</button><button class="nav-btn" data-view="handoff"><span>📋</span>Handoff</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='a4a-kitten-care-v3';
let state=loadState(),activeView='today',activeKittenId=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(x&&Array.isArray(x.kittens)&&Array.isArray(x.events)){x.settings=x.settings||{};x.kittens=x.kittens.map(k=>({...k,medications:k.medications||[],photo:k.photo||null,litter:k.litter||''}));return x}}catch(e){console.error(e)}return{version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function kitten(id){return state.kittens.find(k=>k.id===id)}
function events(id,type){return state.events.filter(e=>e.kittenId===id&&(!type||e.type===type)).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function last(id,type){return events(id,type)[0]||null}
function sameDay(a,b){const d=new Date(a),x=new Date(b);return d.toDateString()===x.toDateString()}
function fmtTime(x){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(x))}
function fmtDate(x){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(x))}
function ageText(dob){if(!dob)return'Age unknown';const d=Math.max(0,Math.floor((Date.now()-new Date(dob+'T12:00:00'))/86400000));return d<14?`${d} day${d===1?'':'s'} old`:`${Math.floor(d/7)} wk ${d%7} d`}
function avatar(k,large=false){return `<div class="avatar${large?' large':''}">${k&&k.photo?`<img src="${k.photo}" alt="${esc(k.name)}">`:'🐱'}</div>`}
function latestWeight(k){const e=last(k.id,'weight');return e?Number(e.data.grams):null}
function previousWeight(k){const e=events(k.id,'weight')[1];return e?Number(e.data.grams):null}
function nextFeeding(k){const e=last(k.id,'feeding');return new Date((e?new Date(e.ts).getTime():Date.now())+(e?Number(k.feedingIntervalHours||4)*3600000:0)).toISOString()}
function timeUntil(x){const d=new Date(x)-Date.now(),a=Math.abs(d),h=Math.floor(a/3600000),m=Math.floor((a%3600000)/60000),t=(h?h+'h ':'')+m+'m';return d<0?t+' overdue':'in '+t}
function medStatus(k,m){const logs=state.events.filter(e=>e.kittenId===k.id&&e.type==='medication'&&e.data.medId===m.id&&e.data.status!=='skipped').sort((a,b)=>new Date(b.ts)-new Date(a.ts));const lastDose=logs[0],base=lastDose?new Date(lastDose.ts).getTime():new Date(m.startAt||Date.now()).getTime()-(Number(m.intervalHours)||12)*3600000,next=new Date(base+(Number(m.intervalHours)||12)*3600000).toISOString();return{last:lastDose,next,overdue:new Date(next)<=new Date()}}
function alertsFor(k){const out=[],nf=nextFeeding(k);if(new Date(nf)<=new Date())out.push({kind:'feeding',level:'warn',text:'Feeding '+timeUntil(nf)});const w=latestWeight(k),p=previousWeight(k);if(w!=null&&p!=null&&w<p)out.push({kind:'weight',level:'danger',text:'Weight down '+(p-w)+'g'});(k.medications||[]).forEach(m=>{const s=medStatus(k,m);if(s.overdue)out.push({kind:'medication',level:'danger',text:m.name+' '+timeUntil(s.next),med:m})});return out}
function groups(){const m=new Map();state.kittens.forEach(k=>{const n=(k.litter||'').trim()||'Unassigned litter';if(!m.has(n))m.set(n,[]);m.get(n).push(k)});return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]))}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function render(){$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));$('#app').innerHTML=activeView==='today'?todayView():activeView==='kittens'?kittensView():activeView==='alerts'?alertsView():activeView==='handoff'?handoffView():profileView(activeKittenId);bind()}
function todayView(){const feeds=state.events.filter(e=>e.type==='feeding'&&sameDay(e.ts,new Date())).length,meds=state.events.filter(e=>e.type==='medication'&&e.data.status==='given'&&sameDay(e.ts,new Date())).length,weights=state.events.filter(e=>e.type==='weight'&&sameDay(e.ts,new Date())).length;return `<div class="hero"><div><h1>Today</h1><p>${state.kittens.length?`Care overview for ${state.kittens.length} kitten${state.kittens.length===1?'':'s'}`:'Set up your first foster kitten'}</p></div><div class="date-pill">${new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date())}</div></div><div class="summary-grid"><div class="summary-box"><b>${state.kittens.length}</b><span>Kittens</span></div><div class="summary-box"><b>${feeds}</b><span>Feeds today</span></div><div class="summary-box"><b>${meds}</b><span>Meds given</span></div><div class="summary-box"><b>${weights}</b><span>Weights today</span></div></div><div class="card" style="margin-top:13px"><div class="card-head"><h2>Who needs care now?</h2><span class="subtle">Based on care logs</span></div>${state.kittens.length?`<div class="status-list">${state.kittens.map(statusCard).join('')}</div>`:`<div class="empty"><div class="emoji">🐱</div><b>No kittens yet</b><p>Add a kitten to start tracking care.</p><button class="btn primary" data-action="add-kitten">+ Add kitten</button></div>`}</div><div class="card"><div class="card-head"><h2>Quick log</h2><span class="subtle">Fast foster entry</span></div><div class="quick-grid">${quickButtons()}</div></div>${recentCard()}`}
function quickButtons(kid=''){return[['feeding','🍼','Feeding'],['weight','⚖️','Weight'],['medication','💊','Medication'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}" ${kid?`data-kitten="${kid}"`:''}><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}
function statusCard(k){const a=alertsFor(k)[0],w=latestWeight(k),f=last(k.id,'feeding');return `<div class="status-item" data-open-kitten="${k.id}">${avatar(k)}<div><h3>${esc(k.name)}</h3><div class="status-line">${w!=null?w+'g':'No weight yet'} · ${ageText(k.dob)}</div><div class="status-line">${f?'Last fed '+fmtTime(f.ts):'No feeding logged'}</div><span class="litter-chip">${esc(k.litter||'Unassigned litter')}</span>${a?`<div style="margin-top:6px"><span class="badge ${a.level}">⚠ ${esc(a.text)}</span></div>`:`<div style="margin-top:6px"><span class="badge ok">✓ Current</span></div>`}</div><div class="action-stack">${a&&a.kind!=='weight'?`<button class="btn ghost small" data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}>Log</button>`:`<button class="btn secondary small" data-open-kitten="${k.id}">Open</button>`}</div></div>`}
function kittensView(){return `<div class="hero"><div><h1>Kittens</h1><p>Grouped by litter</p></div><button class="btn primary" data-action="add-kitten">+ Add</button></div>${state.kittens.length?groups().map(([name,kids])=>`<section class="litter-section"><div class="litter-head"><h2>🐾 ${esc(name)}</h2><span class="litter-count">${kids.length} kitten${kids.length===1?'':'s'}</span></div><div class="kitten-grid">${kids.map(k=>`<button class="kitten-tile" data-open-kitten="${k.id}"><div class="top">${avatar(k)}<div><h3>${esc(k.name)}</h3><p>${ageText(k.dob)}${k.sex?' · '+esc(k.sex):''}</p></div></div><div class="metric-row"><div class="metric"><b>${latestWeight(k)??'—'}</b><span>grams</span></div><div class="metric"><b>${events(k.id,'feeding').filter(e=>sameDay(e.ts,new Date())).length}</b><span>feeds</span></div><div class="metric"><b>${(k.medications||[]).length}</b><span>meds</span></div></div></button>`).join('')}</div></section>`).join(''):`<div class="card"><div class="empty">No kittens yet.</div></div>`}`}
function profileView(id){const k=kitten(id);if(!k)return kittensView();const w=latestWeight(k),p=previousWeight(k),gain=w!=null&&p!=null?w-p:null,meds=k.medications||[];return `<div class="hero"><div><button class="btn secondary small" data-action="back-kittens">← Kittens</button><h1 style="margin-top:10px">${esc(k.name)}</h1><p>${ageText(k.dob)}${k.sex?' · '+esc(k.sex):''}</p><span class="litter-chip">${esc(k.litter||'Unassigned litter')}</span></div>${avatar(k,true)}</div><div class="card"><div class="card-head"><h2>At a glance</h2><button class="btn secondary small" data-action="edit-kitten" data-kitten="${k.id}">Edit</button></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${gain==null?'—':(gain>0?'+':'')+gain}</b><span>last change</span></div><div class="metric"><b>${k.feedingIntervalHours||4}h</b><span>feed interval</span></div></div><div class="quick-grid">${quickButtons(k.id)}</div></div><div class="card"><div class="card-head"><h2>Medication plan</h2><button class="btn ghost small" data-action="add-med" data-kitten="${k.id}">+ Medication</button></div>${meds.length?meds.map(m=>{const s=medStatus(k,m);return `<div class="med-row"><div><h4>💊 ${esc(m.name)}</h4><p>${esc(m.dose)} ${esc(m.unit)} · ${esc(m.route)} · every ${m.intervalHours}h</p><p>${s.last?'Last '+fmtTime(s.last.ts):'No dose logged'} · <b>${timeUntil(s.next)}</b></p></div><div class="action-stack"><button class="btn ${s.overdue?'primary':'ghost'} small" data-log="medication" data-kitten="${k.id}" data-med="${m.id}">${s.overdue?'Give':'Log'}</button><button class="btn secondary small" data-action="edit-med" data-kitten="${k.id}" data-med="${m.id}">Edit</button></div></div>`}).join(''):`<div class="empty">No medications assigned.</div>`}</div><div class="card"><div class="card-head"><h2>Care timeline</h2></div>${events(k.id).length?`<div class="timeline">${events(k.id).slice(0,20).map(eventRow).join('')}</div>`:`<div class="empty">No care events yet.</div>`}</div>`}
function alertsView(){const all=state.kittens.flatMap(k=>alertsFor(k).map(a=>({k,a})));return `<div class="hero"><div><h1>Alerts</h1><p>Overdue care and weight changes</p></div><div class="date-pill">${all.length} active</div></div><div class="card">${all.length?`<div class="status-list">${all.map(({k,a})=>`<div class="status-item">${avatar(k)}<div><h3>${esc(k.name)}</h3><div class="status-line">${esc(a.text)}</div></div><button class="btn ghost small" ${a.kind==='weight'?`data-open-kitten="${k.id}"`:`data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}`}>Open</button></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>No active alerts</b></div>`}</div>`}
function handoffView(){const text=groups().map(([name,kids])=>`${name}\n${kids.map(k=>{const w=latestWeight(k),f=last(k.id,'feeding'),a=alertsFor(k);return `• ${k.name}: ${w!=null?w+'g':'no weight'}; ${f?'fed '+fmtTime(f.ts):'no feed logged'}${a.length?'; ALERT: '+a.map(x=>x.text).join(', '):''}`}).join('\n')}`).join('\n\n')||'No kittens in care.';return `<div class="hero"><div><h1>Handoff</h1><p>Copy a quick foster status</p></div></div><div class="card"><div class="card-head"><h2>Current handoff</h2><button class="btn primary small" id="copyHandoff">Copy</button></div><div class="handoff" id="handoffText">${esc(text)}</div></div>`}
function recentCard(){const es=[...state.events].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,6);return `<div class="card"><div class="card-head"><h2>Recent care</h2></div>${es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:`<div class="empty">No care logged yet.</div>`}</div>`}
function eventRow(e){const k=kitten(e.kittenId),d=e.data||{},meta={feeding:['🍼','Feeding',`${d.amount||''}${d.unit?' '+d.unit:''}${d.food?' · '+d.food:''}`],weight:['⚖️','Weight',`${d.grams||''} g${d.note?' · '+d.note:''}`],medication:['💊','Medication',`${d.medName||'Medication'} · ${d.status||'given'}`],potty:['🚽','Potty',`Urine ${d.urine||'—'} · stool ${d.stool||'—'}`],note:['📝','Note',d.note||''],health:['🌡️','Health',`${d.temp?d.temp+'°F · ':''}${d.note||d.status||''}`]}[e.type]||['•',e.type,''];return `<div class="event"><div class="event-icon">${meta[0]}</div><div><h4>${esc(k?.name||'Kitten')} · ${esc(meta[1])}</h4><p>${esc(meta[2])}</p></div><time>${sameDay(e.ts,new Date())?fmtTime(e.ts):fmtDate(e.ts)}</time></div>`}
function bind(){$$('[data-open-kitten]').forEach(x=>x.onclick=e=>{e.stopPropagation();activeKittenId=x.dataset.openKitten;activeView='profile';render()});$$('[data-log]').forEach(x=>x.onclick=e=>{e.stopPropagation();openLog(x.dataset.log,x.dataset.kitten||null,x.dataset.med||null)});$$('[data-action]').forEach(x=>x.onclick=e=>{e.stopPropagation();const a=x.dataset.action;if(a==='add-kitten')openKitten();if(a==='edit-kitten')openKitten(kitten(x.dataset.kitten));if(a==='back-kittens'){activeView='kittens';render()}if(a==='add-med')openMed(kitten(x.dataset.kitten));if(a==='edit-med'){const k=kitten(x.dataset.kitten);openMed(k,(k.medications||[]).find(m=>m.id===x.dataset.med))}});const c=$('#copyHandoff');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText($('#handoffText').innerText);toast('Handoff copied')}catch(e){toast('Copy not available')}}}
function showSheet(title,body){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" id="closeSheet">×</button></div>${body}</div></div>`;$('#closeSheet').onclick=closeSheet;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()}}
function closeSheet(){$('#modalRoot').innerHTML=''}
function kittenOptions(id){return state.kittens.map(k=>`<option value="${k.id}" ${k.id===id?'selected':''}>${esc(k.name)} — ${esc(k.litter||'Unassigned')}</option>`).join('')}
function resizePhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,320,320);resolve(c.toDataURL('image/jpeg',.8))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function openKitten(k=null){showSheet(k?'Edit kitten':'Add kitten',`<form id="kittenForm" class="form-grid"><div class="profile-photo-wrap"><div class="photo-preview" id="photoPreview">${k?.photo?`<img src="${k.photo}">`:'🐱'}</div><div style="flex:1"><div class="field"><label>Profile picture</label><input type="file" id="photoInput" accept="image/*" capture="environment"></div><div class="photo-help">Choose or take a kitten photo.</div></div></div><div class="field"><label>Name *</label><input name="name" required value="${esc(k?.name||'')}"></div><div class="identity-grid"><div class="field"><label>Date of birth</label><input type="date" name="dob" value="${k?.dob||''}"></div><div class="field"><label>Sex</label><select name="sex"><option value="">Unknown</option><option ${k?.sex==='Female'?'selected':''}>Female</option><option ${k?.sex==='Male'?'selected':''}>Male</option></select></div></div><div class="field"><label>Litter / group *</label><input name="litter" required value="${esc(k?.litter||'')}" placeholder="e.g. Volcano Litter"></div><div class="two mobile-stack"><div class="field"><label>Intake weight (g)</label><input type="number" min="0" name="intakeWeight" value="${k?.intakeWeight||''}"></div><div class="field"><label>Feed every (hours)</label><input type="number" min="1" max="24" step="0.5" name="feedingIntervalHours" value="${k?.feedingIntervalHours||4}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save</button></div>${k?`<div class="danger-zone"><button type="button" class="btn danger" id="deleteKitten">Remove kitten & logs</button></div>`:''}</form>`);let photo=k?.photo||null;$('#photoInput').onchange=async e=>{if(e.target.files[0]){photo=await resizePhoto(e.target.files[0]);$('#photoPreview').innerHTML=`<img src="${photo}">`}};$('#cancelForm').onclick=closeSheet;$('#kittenForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=k?.id||uid('kitten'),item={...(k||{}),id,name:String(f.get('name')).trim(),dob:f.get('dob'),sex:f.get('sex'),litter:String(f.get('litter')).trim(),intakeWeight:Number(f.get('intakeWeight'))||null,feedingIntervalHours:Number(f.get('feedingIntervalHours'))||4,medications:k?.medications||[],photo};if(k)Object.assign(k,item);else{state.kittens.push(item);if(item.intakeWeight)state.events.push({id:uid('evt'),kittenId:id,type:'weight',ts:new Date().toISOString(),data:{grams:item.intakeWeight}})}save();closeSheet();activeKittenId=id;activeView='profile';render();toast(k?'Kitten updated':'Kitten added')};if(k)$('#deleteKitten').onclick=()=>{if(confirm(`Remove ${k.name} and all logs?`)){state.kittens=state.kittens.filter(x=>x.id!==k.id);state.events=state.events.filter(x=>x.kittenId!==k.id);save();closeSheet();activeView='kittens';render()}}}
function openMed(k,m=null){showSheet(m?'Edit medication':'Add medication',`<form id="medForm" class="form-grid"><div class="field"><label>Medication *</label><input name="name" required value="${esc(m?.name||'')}"></div><div class="two"><div class="field"><label>Dose *</label><input name="dose" required value="${esc(m?.dose||'')}"></div><div class="field"><label>Unit</label><select name="unit">${['mL','mg','tablet','drop'].map(x=>`<option ${m?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Route</label><select name="route">${['Oral','Topical','Eye','Ear','Other'].map(x=>`<option ${m?.route===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Every (hours)</label><input type="number" name="intervalHours" value="${m?.intervalHours||12}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save</button></div></form>`);$('#cancelForm').onclick=closeSheet;$('#medForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),obj={id:m?.id||uid('med'),name:f.get('name'),dose:f.get('dose'),unit:f.get('unit'),route:f.get('route'),intervalHours:Number(f.get('intervalHours'))||12,startAt:m?.startAt||new Date().toISOString()};if(m)Object.assign(m,obj);else{k.medications=k.medications||[];k.medications.push(obj)}save();closeSheet();render()}}
function openLog(type,kid=null,medId=null){if(!state.kittens.length)return openKitten();const selected=kid||activeKittenId||state.kittens[0].id;showSheet('Log '+type,`<form id="logForm" class="form-grid"><div class="field"><label>Kitten</label><select name="kittenId" id="logKitten">${kittenOptions(selected)}</select></div><div id="typeFields"></div><div class="field"><label>Date & time</label><input type="datetime-local" name="when" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save log</button></div></form>`);function fields(k,mid){if(type==='feeding')return `<div class="two"><div class="field"><label>Amount</label><input name="amount"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div></div><div class="field"><label>Food</label><input name="food"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='weight')return `<div class="field"><label>Weight (grams) *</label><input type="number" name="grams" required value="${latestWeight(k)||''}"></div>`;if(type==='medication')return(k.medications||[]).length?`<div class="field"><label>Medication</label><select name="medId">${k.medications.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option value="given">Given</option><option value="skipped">Skipped</option><option value="unable">Unable</option></select></div>`:`<div class="notice">Add a medication plan first.</div><input type="hidden" name="noMed" value="1">`;if(type==='potty')return `<div class="two"><div class="field"><label>Urine</label><select name="urine"><option>yes</option><option>no</option><option>unknown</option></select></div><div class="field"><label>Stool</label><select name="stool"><option>Normal</option><option>Soft</option><option>Diarrhea</option><option>Hard</option><option>Not observed</option></select></div></div>`;if(type==='note')return `<div class="field"><label>Care note</label><textarea name="note" required></textarea></div>`;return `<div class="two"><div class="field"><label>Temperature °F</label><input name="temp"></div><div class="field"><label>Status</label><select name="status"><option>Normal</option><option>Monitor</option><option>Concern</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`}function refresh(mid=medId){$('#typeFields').innerHTML=fields(kitten($('#logKitten').value),mid)}refresh();$('#logKitten').onchange=()=>refresh(null);$('#cancelForm').onclick=closeSheet;$('#logForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('noMed'))return toast('Add medication plan first');const k=kitten(f.get('kittenId')),data={};for(const [key,val]of f.entries())if(!['kittenId','when'].includes(key))data[key]=val;if(type==='weight')data.grams=Number(data.grams);if(type==='medication')data.medName=(k.medications||[]).find(m=>m.id===data.medId)?.name||'Medication';state.events.push({id:uid('evt'),kittenId:k.id,type,ts:new Date(f.get('when')).toISOString(),data});save();closeSheet();render();toast('Care log saved')}}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a4a-kitten-care-backup.json';a.click();URL.revokeObjectURL(a.href)}
function settings(){showSheet('Settings & data',`<div class="notice">Data and kitten photos are stored in this browser.</div><button class="btn danger" id="clearBtn">Clear all V3 data</button>`);$('#clearBtn').onclick=()=>{if(confirm('Clear all V3 data?')){state={version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}};save();closeSheet();activeView='today';render()}}}
$$('.nav-btn').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});$('#quickFab').onclick=()=>openLog('feeding');$('#backupBtn').onclick=backup;$('#settingsBtn').onclick=settings;render();
})();
</script>
</body>
</html>
