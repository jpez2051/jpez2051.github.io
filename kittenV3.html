<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b95c3d">
<title>Action 4 Animals Foster Kitten Care</title>
<style>
:root{--brand:#b95c3d;--brand2:#d77a56;--ink:#47271e;--muted:#8a675b;--bg:#fff8f3;--card:#fff;--line:#f0d9cf;--soft:#fcede6;--ok:#2f7d4c;--warn:#b66a15;--danger:#b93d3d;--shadow:0 8px 26px rgba(84,42,25,.10);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}body{padding-bottom:98px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 13px;box-shadow:0 5px 20px rgba(90,37,20,.18)}.header-row{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;opacity:.82;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.brand strong{font-size:18px}.head-actions{display:flex;gap:7px}.icon-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 9px;font-weight:700}.container{max-width:820px;margin:0 auto;padding:16px 13px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.hero h1{font-size:23px;margin:0 0 4px}.hero p{margin:0;color:var(--muted);font-size:13px}.date-pill{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--muted);font-size:11px;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin:0 0 13px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px}.card-head h2{font-size:16px;margin:0}.subtle{color:var(--muted);font-size:11px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost{background:var(--soft);color:var(--brand)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.btn.small{padding:7px 9px;font-size:11px}.empty{padding:22px 13px;text-align:center;color:var(--muted)}.empty .emoji{font-size:33px;margin-bottom:7px}.notice{background:#fff7e8;border:1px solid #f2deb3;color:#7b571c;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}.success-note{background:#edf8f1;border:1px solid #cfe8d8;color:#2f6e48;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}
.status-list{display:grid;gap:9px}.status-item{border:1px solid var(--line);border-radius:15px;padding:11px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f6d8c8,#f9eee8);display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.status-item h3{margin:0 0 3px;font-size:14px}.status-line{font-size:11px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.ok{background:#e9f6ee;color:var(--ok)}.badge.warn{background:#fff4e5;color:var(--warn)}.badge.danger{background:#fff0f0;color:var(--danger)}.badge.neutral{background:#f6f0ed;color:var(--muted)}.action-stack{display:grid;gap:5px;justify-items:end}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 5px;text-align:center;color:var(--ink)}.quick-btn span{display:block;font-size:22px;margin-bottom:3px}.quick-btn b{font-size:10px}.kitten-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}.kitten-tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:left}.kitten-tile .top{display:flex;align-items:center;gap:9px}.kitten-tile h3{font-size:14px;margin:0}.kitten-tile p{font-size:10px;color:var(--muted);margin:3px 0 0}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.metric{background:#fff9f6;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.metric b{display:block;font-size:17px}.metric span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:40px 1fr auto;gap:9px;border-bottom:1px solid #f4e5df;padding:8px 0}.event:last-child{border:0}.event-icon{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.event h4{margin:0 0 3px;font-size:12px}.event p{margin:0;color:var(--muted);font-size:11px}.event time{font-size:9px;color:var(--muted);white-space:nowrap}.med-row{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.med-row h4{margin:0 0 3px;font-size:12px}.med-row p{margin:0;color:var(--muted);font-size:10px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary-box{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fffaf8}.summary-box b{display:block;font-size:18px}.summary-box span{font-size:10px;color:var(--muted)}.handoff{white-space:pre-wrap;background:#fffaf8;border:1px dashed #e3c7bb;border-radius:13px;padding:11px;font-size:12px;line-height:1.45}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:9px;padding:5px}.nav-btn span{display:block;font-size:20px;margin-bottom:2px}.nav-btn.active{color:var(--brand);font-weight:800}.fab{width:56px;height:56px;border-radius:50%;border:5px solid var(--bg);background:var(--brand);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(121,50,30,.25);justify-self:center;margin-top:-28px}.overlay{position:fixed;z-index:100;inset:0;background:rgba(43,24,17,.52);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:820px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:17px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-head h2{margin:0;font-size:18px}.close{border:0;background:#f5eeea;width:35px;height:35px;border-radius:50%;font-size:18px}.form-grid{display:grid;gap:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #e7cec2;border-radius:12px;background:#fffaf8;padding:10px 11px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(185,92,61,.09)}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}.danger-zone{margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:200;left:50%;bottom:106px;transform:translateX(-50%);background:#36221c;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px;box-shadow:var(--shadow)}@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}.quick-grid{grid-template-columns:repeat(6,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="header-row"><div class="brand"><small>Action 4 Animals</small><strong>🐾 Foster Kitten Care</strong></div><div class="head-actions"><button class="icon-btn" id="backupBtn">⇩ Backup</button><button class="icon-btn" id="settingsBtn">⚙</button></div></div></header>
<main class="container" id="app"></main>
<nav class="bottom-nav"><button class="nav-btn active" data-view="today"><span>🏠</span>Today</button><button class="nav-btn" data-view="kittens"><span>🐱</span>Kittens</button><button class="fab" id="quickFab">+</button><button class="nav-btn" data-view="alerts"><span>🔔</span>Alerts</button><button class="nav-btn" data-view="handoff"><span>📋</span>Handoff</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='a4a-kitten-care-v3';let state=loadState();let activeView='today',activeKittenId=null;
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function nowISO(){return new Date().toISOString()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtTime(x){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(x))}
function fmtDate(x){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(x))}
function sameDay(a,b=new Date()){const d=new Date(a);return d.toDateString()===new Date(b).toDateString()}
function todayLabel(){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date())}
function ageText(dob){if(!dob)return'Age unknown';const d=Math.max(0,Math.floor((Date.now()-new Date(dob+'T12:00:00'))/86400000));if(d<14)return d+' day'+(d===1?'':'s')+' old';return Math.floor(d/7)+' wk '+(d%7)+' d'}
function loadState(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY));if(p&&Array.isArray(p.kittens)&&Array.isArray(p.events)){p.settings=p.settings||{};return p}}catch(e){}return{version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function kitten(id){return state.kittens.find(k=>k.id===id)}
function events(id,type){return state.events.filter(e=>(!id||e.kittenId===id)&&(!type||e.type===type)).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function last(id,type){return events(id,type)[0]||null}
function latestWeight(k){const e=last(k.id,'weight');return e?Number(e.data.grams):null}
function priorWeight(k){const x=events(k.id,'weight');return x[1]?Number(x[1].data.grams):null}
function nextFeed(k){const e=last(k.id,'feeding');return new Date((e?new Date(e.ts).getTime():Date.now()-1)+(Number(k.feedingIntervalHours)||4)*3600000).toISOString()}
function timeUntil(x){const n=new Date(x)-Date.now(),a=Math.abs(n),h=Math.floor(a/3600000),m=Math.floor(a%3600000/60000),t=(h?h+'h ':'')+m+'m';return n<0?t+' overdue':'in '+t}
function medStatus(k,m){const x=events(k.id,'medication').filter(e=>e.data.medId===m.id&&e.data.status==='given');const base=x[0]?new Date(x[0].ts).getTime():new Date(m.startAt||Date.now()).getTime()-(Number(m.intervalHours)||12)*3600000;const next=new Date(base+(Number(m.intervalHours)||12)*3600000).toISOString();return{last:x[0]||null,next,overdue:new Date(next)<=new Date()}}
function alertsFor(k){const a=[],nf=nextFeed(k);if(new Date(nf)<=new Date())a.push({kind:'feeding',level:'warn',text:'Feeding '+timeUntil(nf)});const w=latestWeight(k),p=priorWeight(k);if(w!=null&&p!=null&&w<p)a.push({kind:'weight',level:'danger',text:'Weight down '+(p-w)+'g'});(k.medications||[]).forEach(m=>{const s=medStatus(k,m);if(s.overdue)a.push({kind:'medication',level:'danger',text:m.name+' '+timeUntil(s.next),med:m})});return a}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1800)}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));const a=document.getElementById('app');a.innerHTML=activeView==='today'?todayView():activeView==='kittens'?kittensView():activeView==='alerts'?alertsView():activeView==='handoff'?handoffView():profileView(activeKittenId);bind()}
function todayView(){const ks=state.kittens,all=ks.flatMap(k=>alertsFor(k));return `<div class="hero"><div><h1>Today</h1><p>${ks.length?`${ks.length} foster kitten${ks.length===1?'':'s'} · ${all.length} active alert${all.length===1?'':'s'}`:'Set up your first foster kitten'}</p></div><div class="date-pill">${todayLabel()}</div></div>${dailySummary()}<div class="card"><div class="card-head"><h2>Who needs care now?</h2><span class="subtle">Based on care logs</span></div>${ks.length?`<div class="status-list">${ks.map(statusCard).join('')}</div>`:`<div class="empty"><div class="emoji">🐱</div><b>No kittens yet</b><p>Add a kitten to begin tracking feedings, weights and medications.</p><button class="btn primary" data-action="add-kitten">+ Add kitten</button></div>`}</div><div class="card"><div class="card-head"><h2>Quick log</h2><span class="subtle">Fast foster entry</span></div><div class="quick-grid">${quickButtons()}</div></div>${recentCard()}`}
function dailySummary(){const f=events(null,'feeding').filter(e=>sameDay(e.ts)),w=events(null,'weight').filter(e=>sameDay(e.ts)),m=events(null,'medication').filter(e=>sameDay(e.ts)&&e.data.status==='given'),p=events(null,'potty').filter(e=>sameDay(e.ts));return `<div class="card"><div class="card-head"><h2>Today at a glance</h2><span class="subtle">All kittens</span></div><div class="summary-grid"><div class="summary-box"><b>${f.length}</b><span>feedings logged</span></div><div class="summary-box"><b>${w.length}</b><span>weights logged</span></div><div class="summary-box"><b>${m.length}</b><span>med doses given</span></div><div class="summary-box"><b>${p.length}</b><span>potty checks</span></div></div></div>`}
function quickButtons(id=''){return [['feeding','🍼','Feed'],['weight','⚖️','Weight'],['medication','💊','Meds'],['potty','🚽','Potty'],['health','🌡️','Health'],['note','📝','Note']].map(x=>`<button class="quick-btn" data-log="${x[0]}" ${id?`data-kitten="${id}"`:''}><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}
function statusCard(k){const a=alertsFor(k),w=latestWeight(k),f=last(k.id,'feeding'),top=a[0];return `<div class="status-item"><div class="avatar" data-open-kitten="${k.id}">🐱</div><div data-open-kitten="${k.id}"><h3>${esc(k.name)}</h3><div class="status-line">${w!=null?w+'g':'No weight'} · ${ageText(k.dob)}</div><div class="status-line">${f?'Last fed '+fmtTime(f.ts):'No feeding logged'}</div>${top?`<div style="margin-top:5px"><span class="badge ${top.level}">${top.level==='danger'?'⚠':'⏱'} ${esc(top.text)}</span></div>`:`<div style="margin-top:5px"><span class="badge ok">✓ Current</span></div>`}</div><div class="action-stack">${top&&top.kind!=='weight'?`<button class="btn ghost small" data-log="${top.kind}" data-kitten="${k.id}" ${top.med?`data-med="${top.med.id}"`:''}>Log</button>`:`<button class="btn secondary small" data-open-kitten="${k.id}">Open</button>`}</div></div>`}
function kittensView(){return `<div class="hero"><div><h1>Kittens</h1><p>Profiles and care plans</p></div><button class="btn primary" data-action="add-kitten">+ Add</button></div>${state.kittens.length?`<div class="kitten-grid">${state.kittens.map(k=>{const w=latestWeight(k),p=priorWeight(k),d=w!=null&&p!=null?w-p:null;return `<button class="kitten-tile" data-open-kitten="${k.id}"><div class="top"><div class="avatar">🐱</div><div><h3>${esc(k.name)}</h3><p>${esc(k.litter||'No litter')} · ${ageText(k.dob)}</p></div></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${d==null?'—':(d>0?'+':'')+d}</b><span>change</span></div><div class="metric"><b>${alertsFor(k).length}</b><span>alerts</span></div></div></button>`}).join('')}</div>`:`<div class="card"><div class="empty"><div class="emoji">🐾</div><b>Your foster roster is empty.</b></div></div>`}`}
function profileView(id){const k=kitten(id);if(!k)return kittensView();const w=latestWeight(k),p=priorWeight(k),d=w!=null&&p!=null?w-p:null,meds=k.medications||[];return `<div class="hero"><div><button class="btn secondary small" data-action="back-kittens">← Kittens</button><h1 style="margin-top:9px">${esc(k.name)}</h1><p>${ageText(k.dob)}${k.litter?' · '+esc(k.litter):''}${k.sex?' · '+esc(k.sex):''}</p></div><div class="avatar" style="width:58px;height:58px;font-size:28px">🐱</div></div><div class="card"><div class="card-head"><h2>At a glance</h2><button class="btn secondary small" data-action="edit-kitten" data-kitten="${k.id}">Edit</button></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${d==null?'—':(d>0?'+':'')+d}</b><span>last change</span></div><div class="metric"><b>${k.feedingIntervalHours||4}h</b><span>feed interval</span></div></div><div class="quick-grid">${quickButtons(k.id)}</div></div><div class="card"><div class="card-head"><h2>Medication plan</h2><button class="btn ghost small" data-action="add-med" data-kitten="${k.id}">+ Medication</button></div>${meds.length?meds.map(m=>{const s=medStatus(k,m);return `<div class="med-row"><div><h4>💊 ${esc(m.name)}</h4><p>${esc(m.dose)} ${esc(m.unit)} · ${esc(m.route)} · every ${m.intervalHours}h</p><p>${s.last?'Last '+fmtTime(s.last.ts):'No dose logged'} · <b>${timeUntil(s.next)}</b></p></div><div class="action-stack"><button class="btn ${s.overdue?'primary':'ghost'} small" data-log="medication" data-kitten="${k.id}" data-med="${m.id}">${s.overdue?'Give':'Log'}</button><button class="btn secondary small" data-action="edit-med" data-kitten="${k.id}" data-med="${m.id}">Edit</button></div></div>`}).join(''):`<div class="empty">No medications assigned.</div>`}</div><div class="card"><div class="card-head"><h2>Care timeline</h2><span class="subtle">Newest first</span></div>${timeline(events(k.id).slice(0,30))}</div>`}
function alertsView(){const a=state.kittens.flatMap(k=>alertsFor(k).map(x=>({k,x})));return `<div class="hero"><div><h1>Alerts</h1><p>Overdue care and weight changes</p></div><div class="date-pill">${a.length} active</div></div><div class="card">${a.length?`<div class="status-list">${a.map(({k,x})=>`<div class="status-item"><div class="avatar">${x.kind==='feeding'?'🍼':x.kind==='medication'?'💊':'⚖️'}</div><div><h3>${esc(k.name)}</h3><div class="status-line">${esc(x.text)}</div></div><button class="btn ghost small" ${x.kind==='weight'?`data-open-kitten="${k.id}"`:`data-log="${x.kind}" data-kitten="${k.id}" ${x.med?`data-med="${x.med.id}"`:''}`}>Open</button></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>No active alerts</b><p>Nothing is overdue based on the plans stored on this device.</p></div>`}</div><div class="notice">Weight alerts currently flag any drop from the previous recorded weight. This is a tracking aid, not a veterinary diagnosis.</div>`}
function handoffView(){const notes=events(null,'note').filter(e=>Date.now()-new Date(e.ts)<86400000).slice(0,10);const lines=state.kittens.map(k=>{const f=last(k.id,'feeding'),w=latestWeight(k),a=alertsFor(k);return `${k.name}: ${w!=null?w+'g':'no weight'}; ${f?'last fed '+fmtTime(f.ts):'no feeding logged'}; ${a.length?a.map(x=>x.text).join(', '):'no active alerts'}.`});return `<div class="hero"><div><h1>Handoff</h1><p>Quick summary for the next foster or coordinator</p></div><div class="date-pill">${todayLabel()}</div></div><div class="card"><div class="card-head"><h2>Current status</h2><button class="btn ghost small" id="copyHandoff">Copy</button></div><div class="handoff" id="handoffText">${esc(lines.length?lines.join('\n'):'No kittens are currently listed.')}</div></div><div class="card"><div class="card-head"><h2>Last 24h notes</h2><span class="subtle">Care notes only</span></div>${notes.length?timeline(notes):'<div class="empty">No handoff notes in the last 24 hours.</div>'}</div>`}
function recentCard(){return `<div class="card"><div class="card-head"><h2>Recent care</h2><span class="subtle">Latest activity</span></div>${timeline(events().slice(0,8))}</div>`}
function timeline(es){return es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:'<div class="empty">No care logged yet.</div>'}
function eventRow(e){const k=kitten(e.kittenId),m=eventMeta(e);return `<div class="event"><div class="event-icon">${m.icon}</div><div><h4>${esc(k?.name||'Kitten')} · ${m.title}</h4><p>${esc(m.detail)}</p></div><time>${sameDay(e.ts)?fmtTime(e.ts):fmtDate(e.ts)}</time></div>`}
function eventMeta(e){const d=e.data||{};if(e.type==='feeding')return{icon:'🍼',title:'Feeding',detail:[d.amount?d.amount+' '+(d.unit||'mL'):'',d.method,d.appetite,d.food,d.note].filter(Boolean).join(' · ')||'Feeding logged'};if(e.type==='weight')return{icon:'⚖️',title:'Weight',detail:d.grams+'g'+(d.note?' · '+d.note:'')};if(e.type==='medication'){const k=kitten(e.kittenId),m=(k?.medications||[]).find(x=>x.id===d.medId);return{icon:'💊',title:'Medication',detail:(m?.name||'Medication')+' · '+(d.status||'given')+(d.note?' · '+d.note:'')}}if(e.type==='potty')return{icon:'🚽',title:'Potty',detail:'Urine '+(d.urine||'unknown')+' · Stool '+(d.stool||'not observed')+(d.note?' · '+d.note:'')};if(e.type==='health')return{icon:'🌡️',title:'Health',detail:[d.temp?d.temp+'°F':'',d.energy,d.hydration,d.note].filter(Boolean).join(' · ')||'Health check'};return{icon:'📝',title:'Note',detail:d.note||'Care note'}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function sheet(title,body){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" id="closeSheet">×</button></div>${body}</div></div>`;closeSheet.onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()}}
function kittenOptions(sel){return state.kittens.map(k=>`<option value="${k.id}" ${k.id===sel?'selected':''}>${esc(k.name)}</option>`).join('')}
function openKitten(k=null){sheet(k?'Edit kitten':'Add kitten',`<form id="kittenForm" class="form-grid"><input type="hidden" name="id" value="${k?.id||''}"><div class="field"><label>Name *</label><input name="name" required value="${esc(k?.name||'')}"></div><div class="two"><div class="field"><label>Date of birth</label><input type="date" name="dob" value="${k?.dob||''}"></div><div class="field"><label>Sex</label><select name="sex"><option value="">Unknown</option><option ${k?.sex==='Female'?'selected':''}>Female</option><option ${k?.sex==='Male'?'selected':''}>Male</option></select></div></div><div class="field"><label>Litter / group</label><input name="litter" value="${esc(k?.litter||'')}"></div><div class="two"><div class="field"><label>Intake weight (g)</label><input type="number" min="0" step="1" name="intakeWeight" value="${k?.intakeWeight||''}"></div><div class="field"><label>Feed every (hours)</label><input type="number" min="1" max="24" step="0.5" name="feedingIntervalHours" value="${k?.feedingIntervalHours||4}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn primary">Save</button></div>${k?`<div class="danger-zone"><button type="button" class="btn danger" id="removeKitten">Remove kitten and local logs</button></div>`:''}</form>`);cancel.onclick=closeModal;kittenForm.onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=f.get('id')||uid('kitten'),old=kitten(id),item={...(old||{}),id,name:String(f.get('name')).trim(),dob:f.get('dob'),sex:f.get('sex'),litter:String(f.get('litter')).trim(),intakeWeight:Number(f.get('intakeWeight'))||null,feedingIntervalHours:Number(f.get('feedingIntervalHours'))||4,medications:old?.medications||[]};if(old)Object.assign(old,item);else{state.kittens.push(item);if(item.intakeWeight)state.events.push({id:uid('evt'),kittenId:id,type:'weight',ts:nowISO(),data:{grams:item.intakeWeight,source:'intake'}})}save();closeModal();activeView='profile';activeKittenId=id;render();toast(old?'Kitten updated':'Kitten added')};if(k)removeKitten.onclick=()=>{if(confirm(`Remove ${k.name} and all local care logs?`)){state.kittens=state.kittens.filter(x=>x.id!==k.id);state.events=state.events.filter(x=>x.kittenId!==k.id);save();closeModal();activeView='kittens';render()}}}
function openMed(k,m=null){sheet(m?'Edit medication':'Add medication',`<form id="medPlan" class="form-grid"><div class="notice">Medication plans are stored on this device in this prototype.</div><div class="field"><label>Medication *</label><input name="name" required value="${esc(m?.name||'')}"></div><div class="two"><div class="field"><label>Dose *</label><input name="dose" required value="${esc(m?.dose||'')}"></div><div class="field"><label>Unit</label><select name="unit">${['mL','mg','tablet','drop'].map(x=>`<option ${m?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Route</label><select name="route">${['Oral','Topical','Eye','Ear','Other'].map(x=>`<option ${m?.route===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Every (hours)</label><input type="number" min="1" max="168" name="intervalHours" value="${m?.intervalHours||12}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn primary">Save medication</button></div>${m?'<div class="danger-zone"><button type="button" class="btn danger" id="removeMed">Remove medication</button></div>':''}</form>`);cancel.onclick=closeModal;medPlan.onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);k.medications=k.medications||[];const item={id:m?.id||uid('med'),name:String(f.get('name')).trim(),dose:String(f.get('dose')).trim(),unit:f.get('unit'),route:f.get('route'),intervalHours:Number(f.get('intervalHours'))||12,startAt:m?.startAt||nowISO()};if(m)Object.assign(m,item);else k.medications.push(item);save();closeModal();render();toast('Medication saved')};if(m)removeMed.onclick=()=>{if(confirm('Remove this medication plan?')){k.medications=k.medications.filter(x=>x.id!==m.id);save();closeModal();render();toast('Medication removed')}}}
function openLog(type='feeding',kid=null,medId=null){if(!state.kittens.length){openKitten();return}const sel=kid||activeKittenId||state.kittens[0].id,k=kitten(sel);sheet('Log '+({feeding:'feeding',weight:'weight',medication:'medication',potty:'potty',health:'health check',note:'note'}[type]),`<form id="logForm" class="form-grid"><div class="field"><label>Kitten *</label><select name="kittenId" id="logKitten">${kittenOptions(sel)}</select></div><div id="logFields">${logFields(type,k,medId)}</div><div class="field"><label>Time</label><input type="datetime-local" name="when" value="${localDT()}" required></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn primary">Save log</button></div></form>`);cancel.onclick=closeModal;logKitten.onchange=e=>{logFieldsEl.innerHTML=logFields(type,kitten(e.target.value),null)};const logFieldsEl=document.getElementById('logFields');logForm.onsubmit=e=>submitLog(e,type)}
function localDT(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function logFields(type,k,medId){if(type==='feeding')return `<div class="two"><div class="field"><label>Amount</label><input name="amount" inputmode="decimal"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div></div><div class="field"><label>Food</label><input name="food" placeholder="KMR, wet food, gruel..."></div><div class="two"><div class="field"><label>Method</label><select name="method"><option>Bottle</option><option>Syringe</option><option>Gruel</option><option>Wet food</option><option>Dry food</option><option>Nursing</option><option>Other</option></select></div><div class="field"><label>Appetite</label><select name="appetite"><option>Great</option><option selected>Normal</option><option>Poor</option><option>Refused</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='weight')return `<div class="field"><label>Weight (grams) *</label><input type="number" min="1" step="1" name="grams" required value="${latestWeight(k)||''}"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='medication'){const ms=k.medications||[];return ms.length?`<div class="field"><label>Medication *</label><select name="medId">${ms.map(m=>`<option value="${m.id}" ${m.id===medId?'selected':''}>${esc(m.name)} · ${esc(m.dose)} ${esc(m.unit)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option value="given">Given</option><option value="skipped">Skipped</option><option value="unable">Unable to give</option></select></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`:`<div class="notice">${esc(k.name)} has no medication plan yet. Add one from the kitten profile.</div><input type="hidden" name="noMed" value="1">`};if(type==='potty')return `<div class="two"><div class="field"><label>Urinated?</label><select name="urine"><option value="yes">Yes</option><option value="no">No</option><option value="unknown">Not observed</option></select></div><div class="field"><label>Stool</label><select name="stool"><option>Normal</option><option>Soft</option><option>Diarrhea</option><option>Hard</option><option>Abnormal color</option><option>Not observed</option></select></div></div><div class="field"><label>Stimulated?</label><select name="stimulated"><option value="yes">Yes</option><option value="no">No</option></select></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='health')return `<div class="two"><div class="field"><label>Temperature °F</label><input type="number" step="0.1" name="temp"></div><div class="field"><label>Energy</label><select name="energy"><option>Normal</option><option>Sleepy</option><option>Low</option><option>Very low</option></select></div></div><div class="field"><label>Hydration</label><select name="hydration"><option>Normal</option><option>Monitor</option><option>Concern</option></select></div><div class="field"><label>Notes</label><textarea name="note" placeholder="Eyes, nose, breathing, behavior, concerns..."></textarea></div>`;return `<div class="field"><label>Care / handoff note *</label><textarea name="note" required></textarea></div>`}
function submitLog(e,type){e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('noMed')){toast('Add a medication plan first');return}const data={};['amount','unit','food','method','appetite','grams','medId','status','urine','stool','stimulated','temp','energy','hydration','note'].forEach(k=>{if(f.get(k)!==null&&String(f.get(k)).trim()!=='')data[k]=String(f.get(k)).trim()});if(data.grams)data.grams=Number(data.grams);state.events.push({id:uid('evt'),kittenId:f.get('kittenId'),type,ts:new Date(f.get('when')).toISOString(),data});save();closeModal();render();toast('Care logged')}
function settings(){sheet('Backup & restore',`<div class="success-note">Your current V3 data is stored in this browser on this device.</div><div class="form-grid"><button class="btn primary" id="downloadBackup">Download backup</button><div class="field"><label>Restore from JSON backup</label><input type="file" id="restoreFile" accept="application/json,.json"></div><button class="btn secondary" id="restoreBtn">Restore selected backup</button><div class="danger-zone"><button class="btn danger" id="clearAll">Clear all V3 data on this device</button></div></div>`);downloadBackup.onclick=backup;restoreBtn.onclick=restore;clearAll.onclick=()=>{if(confirm('Clear every V3 kitten and care log on this device?')){state={version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}};save();closeModal();activeView='today';render();toast('V3 data cleared')}}}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a4a-kitten-care-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded')}
function restore(){const f=document.getElementById('restoreFile').files[0];if(!f){toast('Choose a backup file');return}const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!Array.isArray(p.kittens)||!Array.isArray(p.events))throw Error();if(confirm('Replace current V3 data with this backup?')){state=p;state.settings=state.settings||{};save();closeModal();activeView='today';render();toast('Backup restored')}}catch(e){toast('Invalid backup file')}};r.readAsText(f)}
function bind(){document.querySelectorAll('[data-open-kitten]').forEach(e=>e.onclick=()=>{activeKittenId=e.dataset.openKitten;activeView='profile';render()});document.querySelectorAll('[data-log]').forEach(e=>e.onclick=x=>{x.stopPropagation();openLog(e.dataset.log,e.dataset.kitten||null,e.dataset.med||null)});document.querySelectorAll('[data-action="add-kitten"]').forEach(e=>e.onclick=()=>openKitten());document.querySelectorAll('[data-action="edit-kitten"]').forEach(e=>e.onclick=()=>openKitten(kitten(e.dataset.kitten)));document.querySelectorAll('[data-action="back-kittens"]').forEach(e=>e.onclick=()=>{activeView='kittens';render()});document.querySelectorAll('[data-action="add-med"]').forEach(e=>e.onclick=()=>openMed(kitten(e.dataset.kitten)));document.querySelectorAll('[data-action="edit-med"]').forEach(e=>e.onclick=()=>{const k=kitten(e.dataset.kitten);openMed(k,(k.medications||[]).find(m=>m.id===e.dataset.med))});const c=document.getElementById('copyHandoff');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('handoffText').textContent);toast('Handoff copied')}catch(e){toast('Copy unavailable')}}}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});quickFab.onclick=()=>openLog('feeding');backupBtn.onclick=backup;settingsBtn.onclick=settings;render();
})();
</script>
</body>
</html>
