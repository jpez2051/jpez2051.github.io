<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a83">
<title>Action 4 Animals Foster Kitten Care</title>
<style>
:root{--navy:#102a83;--navy2:#193ca8;--pink:#ec155d;--pink2:#ff4b82;--ink:#18223b;--muted:#6c7485;--bg:#f5f7fd;--card:#fff;--line:#dfe5f3;--soft:#eef2ff;--softpink:#fff0f5;--ok:#287a4d;--warn:#aa6513;--danger:#c92f49;--shadow:0 8px 26px rgba(16,42,131,.10);--radius:18px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}body{padding-bottom:98px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 13px;box-shadow:0 5px 20px rgba(9,28,98,.22)}.header-row{max-width:840px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;opacity:.82;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.brand strong{font-size:18px}.brand-accent{color:#ff6f9d}.head-actions{display:flex;gap:7px}.icon-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff;border-radius:12px;padding:8px 9px;font-weight:750}.container{max-width:840px;margin:0 auto;padding:16px 13px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.hero h1{font-size:23px;margin:0 0 4px;color:var(--navy)}.hero p{margin:0;color:var(--muted);font-size:13px}.date-pill{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--navy);font-size:11px;font-weight:750;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin:0 0 13px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px}.card-head h2{font-size:16px;margin:0;color:var(--navy)}.subtle{color:var(--muted);font-size:11px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--pink);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.ghost{background:var(--soft);color:var(--navy)}.btn.danger{background:#fff0f2;color:var(--danger);border:1px solid #f4c8d0}.btn.small{padding:7px 9px;font-size:11px}.empty{padding:22px 13px;text-align:center;color:var(--muted)}.empty .emoji{font-size:33px;margin-bottom:7px}.notice{background:#fff7e8;border:1px solid #f2deb3;color:#7b571c;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}.success-note{background:#edf8f1;border:1px solid #cfe8d8;color:#2f6e48;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}
.status-list{display:grid;gap:9px}.status-item{border:1px solid var(--line);border-radius:15px;padding:11px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#edf1ff,#ffe8f1);display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.large{width:72px;height:72px;font-size:30px}.status-item h3{margin:0 0 3px;font-size:14px}.status-line{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.litter-chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;background:var(--soft);color:var(--navy);font-size:9px;font-weight:800;margin-top:5px}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.ok{background:#e9f6ee;color:var(--ok)}.badge.warn{background:#fff4e5;color:var(--warn)}.badge.danger{background:#fff0f2;color:var(--danger)}.badge.neutral{background:#eff2f7;color:var(--muted)}.action-stack{display:grid;gap:5px;justify-items:end}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 5px;text-align:center;color:var(--navy)}.quick-btn span{display:block;font-size:22px;margin-bottom:3px}.quick-btn b{font-size:10px}.litter-section{margin-bottom:16px}.litter-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 8px}.litter-head h2{margin:0;font-size:15px;color:var(--navy)}.litter-count{font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 8px}.kitten-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}.kitten-tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:left;box-shadow:0 4px 14px rgba(16,42,131,.05)}.kitten-tile .top{display:flex;align-items:center;gap:9px}.kitten-tile h3{font-size:14px;margin:0}.kitten-tile p{font-size:10px;color:var(--muted);margin:3px 0 0}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.metric{background:#f8f9ff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.metric b{display:block;font-size:17px;color:var(--navy)}.metric span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;border-bottom:1px solid #edf0f7;padding:8px 0}.event:last-child{border:0}.event-icon{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.event h4{margin:0 0 3px;font-size:12px}.event p{margin:0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.event time{font-size:9px;color:var(--muted);white-space:nowrap}.med-row{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.med-row h4{margin:0 0 3px;font-size:12px}.med-row p{margin:0;color:var(--muted);font-size:10px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary-box{border:1px solid var(--line);border-radius:14px;padding:11px;background:#f9faff}.summary-box b{display:block;font-size:18px;color:var(--navy)}.summary-box span{font-size:10px;color:var(--muted)}.handoff{white-space:pre-wrap;background:#f9faff;border:1px dashed #cbd4ec;border-radius:13px;padding:11px;font-size:12px;line-height:1.45}.profile-photo-wrap{display:flex;align-items:center;gap:12px}.photo-help{font-size:10px;color:var(--muted);line-height:1.35}.photo-preview{width:74px;height:74px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:28px}.photo-preview img{width:100%;height:100%;object-fit:cover}.identity-grid,.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.identity-grid>*{min-width:0}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:9px;padding:5px}.nav-btn span{display:block;font-size:20px;margin-bottom:2px}.nav-btn.active{color:var(--navy);font-weight:800}.fab{width:56px;height:56px;border-radius:50%;border:5px solid var(--bg);background:var(--pink);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(236,21,93,.28);justify-self:center;margin-top:-28px}.overlay{position:fixed;z-index:100;inset:0;background:rgba(10,21,65,.52);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:840px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:17px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-head h2{margin:0;font-size:18px;color:var(--navy)}.close{border:0;background:#eef1f9;width:35px;height:35px;border-radius:50%;font-size:18px;color:var(--navy)}.form-grid{display:grid;gap:11px}.field{min-width:0}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.field input,.field select,.field textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid #ced6eb;border-radius:12px;background:#fbfcff;padding:10px 11px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(25,60,168,.10)}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}.danger-zone{margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:200;left:50%;bottom:106px;transform:translateX(-50%);background:#17245d;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px;box-shadow:var(--shadow)}
@media(max-width:500px){.identity-grid{grid-template-columns:1fr}.two.mobile-stack{grid-template-columns:1fr}.hero{align-items:flex-start}.status-item{grid-template-columns:auto minmax(0,1fr)}.status-item .action-stack{grid-column:2;justify-items:start;grid-auto-flow:column}.med-row{align-items:flex-start}.profile-photo-wrap{align-items:flex-start}}
@media(max-width:370px){.two{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}.quick-grid{grid-template-columns:repeat(6,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="header-row"><div class="brand"><small>Action 4 Animals Hawaii</small><strong>🐾 Foster Kitten <span class="brand-accent">Care</span></strong></div><div class="head-actions"><button class="icon-btn" id="backupBtn">⇩ Backup</button><button class="icon-btn" id="settingsBtn">⚙</button></div></div></header>
<main class="container" id="app"></main>
<nav class="bottom-nav"><button class="nav-btn active" data-view="today"><span>🏠</span>Today</button><button class="nav-btn" data-view="kittens"><span>🐱</span>Kittens</button><button class="fab" id="quickFab">+</button><button class="nav-btn" data-view="alerts"><span>🔔</span>Alerts</button><button class="nav-btn" data-view="handoff"><span>📋</span>Handoff</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='a4a-kitten-care-v3';
let state=loadState();let activeView='today';let activeKittenId=null;
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function nowISO(){return new Date().toISOString()}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(x&&Array.isArray(x.kittens)&&Array.isArray(x.events)){x.settings=x.settings||{};x.kittens=x.kittens.map(k=>({...k,medications:k.medications||[],photo:k.photo||null,litter:k.litter||''}));return x}}catch(e){}return{version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function kitten(id){return state.kittens.find(k=>k.id===id)}
function events(id,type){return state.events.filter(e=>e.kittenId===id&&(!type||e.type===type)).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function last(id,type){return events(id,type)[0]||null}
function sameDay(a,b){const d=new Date(a),x=new Date(b);return d.getFullYear()===x.getFullYear()&&d.getMonth()===x.getMonth()&&d.getDate()===x.getDate()}
function fmtTime(x){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(x))}
function fmtDate(x){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(x))}
function todayLabel(){return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date())}
function ageText(dob){if(!dob)return'Age unknown';const d=Math.max(0,Math.floor((Date.now()-new Date(dob+'T12:00:00'))/86400000));if(d<14)return d+' day'+(d===1?'':'s')+' old';return Math.floor(d/7)+' wk '+d%7+' d'}
function avatar(k,large=false){return `<div class="avatar${large?' large':''}">${k?.photo?`<img src="${k.photo}" alt="${esc(k.name)}">`:'🐱'}</div>`}
function latestWeight(k){const e=last(k.id,'weight');return e?Number(e.data.grams):null}
function previousWeight(k){const e=events(k.id,'weight')[1];return e?Number(e.data.grams):null}
function nextFeeding(k){const e=last(k.id,'feeding');return new Date((e?new Date(e.ts).getTime():Date.now())+(e?Number(k.feedingIntervalHours||4)*3600000:0)).toISOString()}
function timeUntil(x){const d=new Date(x)-Date.now(),a=Math.abs(d),h=Math.floor(a/3600000),m=Math.floor((a%3600000)/60000),t=(h?h+'h ':'')+m+'m';return d<0?t+' overdue':'in '+t}
function medStatus(k,m){const logs=state.events.filter(e=>e.kittenId===k.id&&e.type==='medication'&&e.data.medId===m.id&&e.data.status!=='skipped').sort((a,b)=>new Date(b.ts)-new Date(a.ts));const lastDose=logs[0],base=lastDose?new Date(lastDose.ts).getTime():new Date(m.startAt||Date.now()).getTime()-(Number(m.intervalHours)||12)*3600000,next=new Date(base+(Number(m.intervalHours)||12)*3600000).toISOString();return{last:lastDose,next,overdue:new Date(next)<=new Date()}}
function alertsFor(k){const out=[],nf=nextFeeding(k);if(new Date(nf)<=new Date())out.push({kind:'feeding',level:'warn',text:'Feeding '+timeUntil(nf)});const w=latestWeight(k),p=previousWeight(k);if(w!=null&&p!=null&&w<p)out.push({kind:'weight',level:'danger',text:'Weight down '+(p-w)+'g'});(k.medications||[]).forEach(m=>{const s=medStatus(k,m);if(s.overdue)out.push({kind:'medication',level:'danger',text:m.name+' '+timeUntil(s.next),med:m})});return out}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1800)}
function groupLitters(){const map=new Map();state.kittens.forEach(k=>{const name=(k.litter||'').trim()||'Unassigned litter';if(!map.has(name))map.set(name,[]);map.get(name).push(k)});return [...map.entries()].sort((a,b)=>a[0]==='Unassigned litter'?1:b[0]==='Unassigned litter'?-1:a[0].localeCompare(b[0]))}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));const app=document.getElementById('app');app.innerHTML=activeView==='today'?todayView():activeView==='kittens'?kittensView():activeView==='alerts'?alertsView():activeView==='handoff'?handoffView():profileView(activeKittenId);bindDynamic()}
function todayView(){const feeds=state.events.filter(e=>e.type==='feeding'&&sameDay(e.ts,new Date())).length,meds=state.events.filter(e=>e.type==='medication'&&e.data.status==='given'&&sameDay(e.ts,new Date())).length,weights=state.events.filter(e=>e.type==='weight'&&sameDay(e.ts,new Date())).length;return `<div class="hero"><div><h1>Today</h1><p>${state.kittens.length?`Care overview for ${state.kittens.length} kitten${state.kittens.length===1?'':'s'}`:'Set up your first foster kitten'}</p></div><div class="date-pill">${todayLabel()}</div></div><div class="summary-grid"><div class="summary-box"><b>${state.kittens.length}</b><span>Kittens</span></div><div class="summary-box"><b>${feeds}</b><span>Feeds today</span></div><div class="summary-box"><b>${meds}</b><span>Meds given</span></div><div class="summary-box"><b>${weights}</b><span>Weights today</span></div></div><div class="card" style="margin-top:13px"><div class="card-head"><h2>Who needs care now?</h2><span class="subtle">Based on care logs</span></div>${state.kittens.length?`<div class="status-list">${state.kittens.map(statusCard).join('')}</div>`:`<div class="empty"><div class="emoji">🐱</div><b>No kittens yet</b><p>Add a kitten to start tracking care.</p><button class="btn primary" data-action="add-kitten">+ Add kitten</button></div>`}</div><div class="card"><div class="card-head"><h2>Quick log</h2><span class="subtle">Fast foster entry</span></div><div class="quick-grid">${[['feeding','🍼','Feeding'],['weight','⚖️','Weight'],['medication','💊','Medication'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div></div>${recentCard()}`}
function statusCard(k){const a=alertsFor(k)[0],w=latestWeight(k),f=last(k.id,'feeding');return `<div class="status-item" data-open-kitten="${k.id}">${avatar(k)}<div><h3>${esc(k.name)}</h3><div class="status-line">${w!=null?w+'g':'No weight yet'} · ${ageText(k.dob)}</div><div class="status-line">${f?'Last fed '+fmtTime(f.ts):'No feeding logged'}</div><span class="litter-chip">${esc(k.litter||'Unassigned litter')}</span>${a?`<div style="margin-top:6px"><span class="badge ${a.level}">⚠ ${esc(a.text)}</span></div>`:`<div style="margin-top:6px"><span class="badge ok">✓ Current</span></div>`}</div><div class="action-stack">${a&&a.kind!=='weight'?`<button class="btn ghost small" data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}>Log</button>`:'<button class="btn secondary small" data-open-kitten="'+k.id+'">Open</button>'}</div></div>`}
function recentCard(){const es=[...state.events].sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,6);return `<div class="card"><div class="card-head"><h2>Recent care</h2><span class="subtle">Latest activity</span></div>${es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:`<div class="empty">No care logged yet.</div>`}</div>`}
function kittensView(){return `<div class="hero"><div><h1>Kittens</h1><p>Grouped by litter</p></div><button class="btn primary" data-action="add-kitten">+ Add</button></div>${state.kittens.length?groupLitters().map(([name,kids])=>`<section class="litter-section"><div class="litter-head"><h2>🐾 ${esc(name)}</h2><span class="litter-count">${kids.length} kitten${kids.length===1?'':'s'}</span></div><div class="kitten-grid">${kids.map(kittenTile).join('')}</div></section>`).join(''):`<div class="card"><div class="empty"><div class="emoji">🐾</div><b>Your foster roster is empty.</b><p>Add the first kitten when an intake arrives.</p></div></div>`}
function kittenTile(k){return `<button class="kitten-tile" data-open-kitten="${k.id}"><div class="top">${avatar(k)}<div><h3>${esc(k.name)}</h3><p>${ageText(k.dob)}${k.sex?' · '+esc(k.sex):''}</p></div></div><div class="metric-row"><div class="metric"><b>${latestWeight(k)??'—'}</b><span>grams</span></div><div class="metric"><b>${events(k.id,'feeding').filter(e=>sameDay(e.ts,new Date())).length}</b><span>feeds</span></div><div class="metric"><b>${(k.medications||[]).length}</b><span>meds</span></div></div></button>`}
function profileView(id){const k=kitten(id);if(!k){activeView='kittens';return kittensView()}const w=latestWeight(k),p=previousWeight(k),gain=w!=null&&p!=null?w-p:null,meds=k.medications||[];return `<div class="hero"><div><button class="btn secondary small" data-action="back-kittens">← Kittens</button><h1 style="margin-top:10px">${esc(k.name)}</h1><p>${ageText(k.dob)}${k.sex?' · '+esc(k.sex):''}</p><span class="litter-chip">${esc(k.litter||'Unassigned litter')}</span></div>${avatar(k,true)}</div><div class="card"><div class="card-head"><h2>At a glance</h2><button class="btn secondary small" data-action="edit-kitten" data-kitten="${k.id}">Edit</button></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${gain==null?'—':(gain>0?'+':'')+gain}</b><span>last change</span></div><div class="metric"><b>${k.feedingIntervalHours||4}h</b><span>feed interval</span></div></div><div class="quick-grid">${[['feeding','🍼','Feed'],['weight','⚖️','Weight'],['medication','💊','Meds'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}" data-kitten="${k.id}"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div></div><div class="card"><div class="card-head"><h2>Medication plan</h2><button class="btn ghost small" data-action="add-med" data-kitten="${k.id}">+ Medication</button></div>${meds.length?meds.map(m=>{const s=medStatus(k,m);return `<div class="med-row"><div><h4>💊 ${esc(m.name)}</h4><p>${esc(m.dose)} ${esc(m.unit)} · ${esc(m.route)} · every ${m.intervalHours}h</p><p>${s.last?'Last '+fmtTime(s.last.ts):'No dose logged'} · <b>${timeUntil(s.next)}</b></p></div><div class="action-stack"><button class="btn ${s.overdue?'primary':'ghost'} small" data-log="medication" data-kitten="${k.id}" data-med="${m.id}">${s.overdue?'Give':'Log'}</button><button class="btn secondary small" data-action="edit-med" data-kitten="${k.id}" data-med="${m.id}">Edit</button></div></div>`}).join(''):`<div class="empty">No medications assigned.</div>`}</div><div class="card"><div class="card-head"><h2>Care timeline</h2><span class="subtle">Newest first</span></div>${events(k.id).length?`<div class="timeline">${events(k.id).slice(0,20).map(eventRow).join('')}</div>`:`<div class="empty">No care events yet.</div>`}</div>`}
function alertsView(){const all=state.kittens.flatMap(k=>alertsFor(k).map(a=>({k,a})));return `<div class="hero"><div><h1>Alerts</h1><p>Overdue care and weight changes</p></div><div class="date-pill">${all.length} active</div></div><div class="card">${all.length?`<div class="status-list">${all.map(({k,a})=>`<div class="status-item">${avatar(k)}<div><h3>${esc(k.name)}</h3><div class="status-line">${esc(a.text)}</div><span class="litter-chip">${esc(k.litter||'Unassigned litter')}</span></div><button class="btn ghost small" ${a.kind==='weight'?`data-open-kitten="${k.id}"`:`data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}`}>Open</button></div>`).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>No active alerts</b><p>Nothing is currently overdue.</p></div>`}</div>`}
function handoffView(){const groups=groupLitters();const text=groups.length?groups.map(([name,kids])=>`${name}\n${kids.map(k=>{const w=latestWeight(k),f=last(k.id,'feeding'),a=alertsFor(k);return `• ${k.name}: ${w!=null?w+'g':'no weight'}; ${f?'fed '+fmtTime(f.ts):'no feed logged'}${a.length?'; ALERT: '+a.map(x=>x.text).join(', '):''}`}).join('\n')}`).join('\n\n'):'No kittens in care.';return `<div class="hero"><div><h1>Handoff</h1><p>Copy a quick foster-to-foster status</p></div></div><div class="card"><div class="card-head"><h2>Current handoff</h2><button class="btn primary small" id="copyHandoff">Copy</button></div><div class="handoff" id="handoffText">${esc(text)}</div></div>`}
function eventRow(e){const k=kitten(e.kittenId),d=e.data||{},meta={feeding:['🍼','Feeding',`${d.amount||''}${d.unit?' '+d.unit:''}${d.food?' · '+d.food:''}`],weight:['⚖️','Weight',`${d.grams||''} g${d.note?' · '+d.note:''}`],medication:['💊','Medication',`${d.medName||'Medication'} · ${d.status||'given'}${d.note?' · '+d.note:''}`],potty:['🚽','Potty',`Urine ${d.urine||'—'} · stool ${d.stool||'—'}`],note:['📝','Note',d.note||''],health:['🌡️','Health',`${d.temp?d.temp+'°F · ':''}${d.note||d.status||''}`]}[e.type]||['•',e.type,''];return `<div class="event"><div class="event-icon">${meta[0]}</div><div><h4>${esc(k?.name||'Kitten')} · ${esc(meta[1])}</h4><p>${esc(meta[2])}</p></div><time>${sameDay(e.ts,new Date())?fmtTime(e.ts):fmtDate(e.ts)}</time></div>`}
function bindDynamic(){document.querySelectorAll('[data-open-kitten]').forEach(x=>x.onclick=e=>{e.stopPropagation();activeKittenId=x.dataset.openKitten;activeView='profile';render()});document.querySelectorAll('[data-log]').forEach(x=>x.onclick=e=>{e.stopPropagation();openLog(x.dataset.log,x.dataset.kitten||null,x.dataset.med||null)});document.querySelectorAll('[data-action]').forEach(x=>x.onclick=e=>{e.stopPropagation();const a=x.dataset.action;if(a==='add-kitten')openKitten();if(a==='edit-kitten')openKitten(kitten(x.dataset.kitten));if(a==='back-kittens'){activeView='kittens';render()}if(a==='add-med')openMed(kitten(x.dataset.kitten));if(a==='edit-med'){const k=kitten(x.dataset.kitten);openMed(k,(k.medications||[]).find(m=>m.id===x.dataset.med))}});const c=document.getElementById('copyHandoff');if(c)c.onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('handoffText').innerText);toast('Handoff copied')}}
function showSheet(title,body){document.getElementById('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" id="closeSheet">×</button></div>${body}</div></div>`;document.getElementById('closeSheet').onclick=closeSheet;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()}}
function closeSheet(){document.getElementById('modalRoot').innerHTML=''}
function kittenOptions(id){return state.kittens.map(k=>`<option value="${k.id}" ${k.id===id?'selected':''}>${esc(k.name)} — ${esc(k.litter||'Unassigned')}</option>`).join('')}
async function resizePhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,320,320);resolve(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
function openKitten(k=null){showSheet(k?'Edit kitten':'Add kitten',`<form id="kittenForm" class="form-grid"><input type="hidden" name="id" value="${k?.id||''}"><div class="profile-photo-wrap"><div class="photo-preview" id="photoPreview">${k?.photo?`<img src="${k.photo}">`:'🐱'}</div><div style="flex:1"><div class="field"><label>Profile picture</label><input type="file" id="photoInput" accept="image/*" capture="environment"></div><div class="photo-help">Photos are resized on this device before being stored so the tracker stays fast.</div>${k?.photo?'<button type="button" class="btn secondary small" id="removePhoto" style="margin-top:7px">Remove photo</button>':''}</div></div><div class="field"><label>Name *</label><input name="name" required value="${esc(k?.name||'')}" placeholder="e.g. Luna"></div><div class="identity-grid"><div class="field"><label>Date of birth</label><input type="date" name="dob" value="${k?.dob||''}"></div><div class="field"><label>Sex</label><select name="sex"><option value="">Unknown</option><option ${k?.sex==='Female'?'selected':''}>Female</option><option ${k?.sex==='Male'?'selected':''}>Male</option></select></div></div><div class="field"><label>Litter / group *</label><input name="litter" required value="${esc(k?.litter||'')}" placeholder="e.g. Valentine’s Litter" list="litterNames"><datalist id="litterNames">${[...new Set(state.kittens.map(x=>x.litter).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="two mobile-stack"><div class="field"><label>Intake weight (g)</label><input type="number" min="0" step="1" name="intakeWeight" value="${k?.intakeWeight||''}"></div><div class="field"><label>Feed every (hours)</label><input type="number" min="1" max="24" step="0.5" name="feedingIntervalHours" value="${k?.feedingIntervalHours||4}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">${k?'Save changes':'Add kitten'}</button></div>${k?`<div class="danger-zone"><button type="button" class="btn danger" id="deleteKitten">Remove kitten & local logs</button></div>`:''}</form>`);let nextPhoto=k?.photo||null;const input=document.getElementById('photoInput');input.onchange=async()=>{if(!input.files[0])return;nextPhoto=await resizePhoto(input.files[0]);document.getElementById('photoPreview').innerHTML=`<img src="${nextPhoto}">`};const rp=document.getElementById('removePhoto');if(rp)rp.onclick=()=>{nextPhoto=null;document.getElementById('photoPreview').textContent='🐱'};document.getElementById('cancelForm').onclick=closeSheet;document.getElementById('kittenForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),id=f.get('id')||uid('kitten'),existing=kitten(id),item={...(existing||{}),id,name:String(f.get('name')).trim(),dob:f.get('dob'),sex:f.get('sex'),litter:String(f.get('litter')).trim(),intakeWeight:Number(f.get('intakeWeight'))||null,feedingIntervalHours:Number(f.get('feedingIntervalHours'))||4,medications:existing?.medications||[],photo:nextPhoto};if(existing)Object.assign(existing,item);else{state.kittens.push(item);if(item.intakeWeight)state.events.push({id:uid('evt'),kittenId:id,type:'weight',ts:nowISO(),data:{grams:item.intakeWeight,source:'intake'}})}save();closeSheet();activeKittenId=id;activeView='profile';render();toast(existing?'Kitten updated':'Kitten added')};if(k)document.getElementById('deleteKitten').onclick=()=>{if(confirm(`Remove ${k.name} and all local care logs?`)){state.kittens=state.kittens.filter(x=>x.id!==k.id);state.events=state.events.filter(x=>x.kittenId!==k.id);save();closeSheet();activeView='kittens';render();toast('Kitten removed')}}}
function openMed(k,m=null){if(!k)return;showSheet(m?'Edit medication':'Add medication',`<form id="medPlanForm" class="form-grid"><div class="field"><label>Medication *</label><input name="name" required value="${esc(m?.name||'')}" placeholder="e.g. Amoxicillin"></div><div class="two"><div class="field"><label>Dose *</label><input name="dose" required value="${esc(m?.dose||'')}" placeholder="0.4"></div><div class="field"><label>Unit</label><select name="unit">${['mL','mg','tablet','drop'].map(x=>`<option ${m?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Route</label><select name="route">${['Oral','Topical','Eye','Ear','Other'].map(x=>`<option ${m?.route===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Every (hours)</label><input type="number" min="1" max="168" name="intervalHours" value="${m?.intervalHours||12}"></div></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">${m?'Save medication':'Add medication'}</button></div>${m?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteMed">Remove medication</button></div>':''}</form>`);document.getElementById('cancelForm').onclick=closeSheet;document.getElementById('medPlanForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),obj={id:m?.id||uid('med'),name:String(f.get('name')).trim(),dose:String(f.get('dose')).trim(),unit:f.get('unit'),route:f.get('route'),intervalHours:Number(f.get('intervalHours'))||12,startAt:m?.startAt||nowISO()};k.medications=k.medications||[];if(m)Object.assign(m,obj);else k.medications.push(obj);save();closeSheet();render();toast(m?'Medication updated':'Medication added')};if(m)document.getElementById('deleteMed').onclick=()=>{if(confirm('Remove this medication from the care plan?')){k.medications=k.medications.filter(x=>x.id!==m.id);save();closeSheet();render();toast('Medication removed')}}}
function openLog(type='feeding',kid=null,medId=null){if(!state.kittens.length){openKitten();return}const selected=kid||activeKittenId||state.kittens[0].id;showSheet('Log '+type,`<form id="logForm" class="form-grid"><div class="field"><label>Kitten *</label><select name="kittenId" id="logKitten">${kittenOptions(selected)}</select></div><div id="typeFields"></div><div class="field"><label>Date & time</label><input type="datetime-local" name="when" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save log</button></div></form>`);function fields(k,mid){const forms={feeding:`<div class="two"><div class="field"><label>Amount</label><input name="amount" inputmode="decimal" placeholder="8"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div></div><div class="field"><label>Food</label><input name="food" placeholder="KMR, wet food, gruel..."></div><div class="two"><div class="field"><label>Method</label><select name="method"><option>Bottle</option><option>Syringe</option><option>Gruel</option><option>Wet food</option><option>Dry food</option><option>Nursing</option></select></div><div class="field"><label>Appetite</label><select name="appetite"><option>Great</option><option selected>Normal</option><option>Poor</option><option>Refused</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`,weight:`<div class="field"><label>Weight (grams) *</label><input type="number" min="1" name="grams" required value="${latestWeight(k)||''}"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`,medication:(k.medications||[]).length?`<div class="field"><label>Medication *</label><select name="medId">${k.medications.map(m=>`<option value="${m.id}" ${m.id===mid?'selected':''}>${esc(m.name)} · ${esc(m.dose)} ${esc(m.unit)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option value="given">Given</option><option value="skipped">Skipped</option><option value="unable">Unable to give</option></select></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`:`<div class="notice">No medication plan for ${esc(k.name)}. Add one from the kitten profile first.</div><input type="hidden" name="noMed" value="1">`,potty:`<div class="two"><div class="field"><label>Urinated?</label><select name="urine"><option value="yes">Yes</option><option value="no">No</option><option value="unknown">Not observed</option></select></div><div class="field"><label>Stool</label><select name="stool"><option>Normal</option><option>Soft</option><option>Diarrhea</option><option>Hard</option><option>Abnormal color</option><option>Not observed</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`,note:`<div class="field"><label>Care note *</label><textarea name="note" required placeholder="Behavior, handoff info, concerns..."></textarea></div>`,health:`<div class="two"><div class="field"><label>Temperature °F</label><input name="temp" inputmode="decimal"></div><div class="field"><label>Status</label><select name="status"><option>Normal</option><option>Monitor</option><option>Concern</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`};return forms[type]}function refresh(mid=medId){document.getElementById('typeFields').innerHTML=fields(kitten(document.getElementById('logKitten').value),mid)}refresh();document.getElementById('logKitten').onchange=()=>refresh(null);document.getElementById('cancelForm').onclick=closeSheet;document.getElementById('logForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('noMed')){toast('Add a medication plan first');return}const kid=f.get('kittenId'),k=kitten(kid),ts=f.get('when')?new Date(f.get('when')).toISOString():nowISO(),d={};for(const [key,val] of f.entries())if(!['kittenId','when'].includes(key))d[key]=val;if(type==='medication'){const m=(k.medications||[]).find(x=>x.id===d.medId);d.medName=m?.name||'Medication'}if(type==='weight')d.grams=Number(d.grams);state.events.push({id:uid('evt'),kittenId:kid,type,ts,data:d});save();closeSheet();render();toast('Care log saved')}}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a4a-kitten-care-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function settings(){showSheet('Settings & data',`<div class="success-note">This V3 prototype stores data and kitten photos on this browser only.</div><div class="form-grid"><button class="btn secondary" id="restoreBtn">Restore backup</button><input class="hidden" type="file" id="restoreInput" accept="application/json"><div class="danger-zone"><button class="btn danger" id="clearBtn">Clear all V3 data</button></div></div>`);document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreInput').click();document.getElementById('restoreInput').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.kittens)||!Array.isArray(x.events))throw Error();state=x;save();closeSheet();render();toast('Backup restored')}catch(err){alert('That file is not a valid A4A kitten backup.')}};r.readAsText(e.target.files[0])};document.getElementById('clearBtn').onclick=()=>{if(confirm('Clear all kitten profiles, photos, medications, and care logs from this browser?')){state={version:3,kittens:[],events:[],settings:{fosterName:'Foster Home'}};save();closeSheet();activeView='today';render();toast('All V3 data cleared')}}}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});document.getElementById('quickFab').onclick=()=>openLog('feeding');document.getElementById('backupBtn').onclick=backup;document.getElementById('settingsBtn').onclick=settings;render();
})();
</script>
</body>
</html>
