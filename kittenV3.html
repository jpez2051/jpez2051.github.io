<style>

.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:13px}.hero h1{font-size:23px;margin:0 0 4px;color:var(--navy)}.hero p{margin:0;color:var(--muted);font-size:13px}.date-pill{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:12px;color:var(--navy);font-size:11px;font-weight:750;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin:0 0 13px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px}.card-head h2{font-size:16px;margin:0;color:var(--navy)}.subtle{color:var(--muted);font-size:11px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750}.btn.primary{background:var(--pink);color:#fff}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.ghost{background:var(--soft);color:var(--navy)}.btn.danger{background:#fff0f2;color:var(--danger);border:1px solid #f4c8d0}.btn.small{padding:7px 9px;font-size:11px}.btn:disabled{opacity:.5;cursor:not-allowed}.empty{padding:22px 13px;text-align:center;color:var(--muted)}.empty .emoji{font-size:33px;margin-bottom:7px}.notice{background:#fff7e8;border:1px solid #f2deb3;color:#7b571c;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}.info{background:#eef3ff;border:1px solid #ccd8f5;color:#294585;border-radius:13px;padding:10px 12px;font-size:12px;margin-bottom:11px}
.status-list{display:grid;gap:9px}.status-item{border:1px solid var(--line);border-radius:15px;padding:11px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#edf1ff,#ffe8f1);display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.large{width:76px;height:76px;font-size:30px}.status-item h3{margin:0 0 3px;font-size:14px}.status-line{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.litter-chip,.status-chip{display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;background:var(--soft);color:var(--navy);font-size:9px;font-weight:800;margin:5px 4px 0 0}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.ok{background:#e9f6ee;color:var(--ok)}.badge.warn{background:#fff4e5;color:var(--warn)}.badge.danger{background:#fff0f2;color:var(--danger)}.badge.neutral{background:#eff2f7;color:var(--muted)}.action-stack{display:grid;gap:5px;justify-items:end}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 5px;text-align:center;color:var(--navy)}.quick-btn span{display:block;font-size:22px;margin-bottom:3px}.quick-btn b{font-size:10px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary-box{border:1px solid var(--line);border-radius:14px;padding:11px;background:#f9faff}.summary-box b{display:block;font-size:18px;color:var(--navy)}.summary-box span{font-size:10px;color:var(--muted)}
.litter-section{margin-bottom:16px}.litter-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:12px}.litter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.litter-head h2{margin:0;font-size:15px;color:var(--navy)}.litter-meta{font-size:10px;color:var(--muted);margin-top:3px}.litter-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kitten-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}.kitten-tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:left}.kitten-tile .top{display:flex;align-items:center;gap:9px}.kitten-tile h3{font-size:14px;margin:0}.kitten-tile p{font-size:10px;color:var(--muted);margin:3px 0 0}
.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.metric{background:#f8f9ff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.metric b{display:block;font-size:17px;color:var(--navy)}.metric span{font-size:9px;color:var(--muted);text-transform:uppercase}
.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;border-bottom:1px solid #edf0f7;padding:8px 0}.event:last-child{border:0}.event-icon{width:36px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center}.event h4{margin:0 0 3px;font-size:12px}.event p{margin:0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.event time{font-size:9px;color:var(--muted);white-space:nowrap}.event-actions{display:flex;gap:5px;margin-top:5px}
.med-row{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:7px}.med-row h4{margin:0 0 3px;font-size:12px}.med-row p{margin:0;color:var(--muted);font-size:10px}.dose-box{margin-top:6px;padding:8px;border-radius:10px;background:#f8f9ff;border:1px solid var(--line);font-size:10px}.dose-box b{color:var(--navy)}
.handoff{white-space:pre-wrap;background:#f9faff;border:1px dashed #cbd4ec;border-radius:13px;padding:11px;font-size:12px;line-height:1.45}
.profile-photo-wrap{display:flex;align-items:flex-start;gap:12px}.photo-preview{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--soft);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:28px;flex:none}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-help{font-size:10px;color:var(--muted);line-height:1.35}
.chart-wrap{width:100%;overflow:hidden}.weight-chart{width:100%;height:150px;display:block}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:3px}
.identity-grid,.two,.three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{min-width:0}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:0 0 5px}.field input,.field select,.field textarea{display:block;width:100%;max-width:100%;min-width:0;border:1px solid #ced6eb;border-radius:12px;background:#fbfcff;padding:10px 11px;color:var(--ink);outline:none}.field textarea{min-height:78px;resize:vertical}.field-check{display:flex;gap:8px;align-items:center;font-size:12px}.form-grid{display:grid;gap:11px}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions .btn{flex:1}.danger-zone{margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}.calc-result{padding:10px;border:1px solid #ccd8f5;background:#eef3ff;border-radius:12px;font-size:12px}.bulk-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f7}.bulk-row:last-child{border-bottom:0}.bulk-name{display:flex;align-items:center;gap:8px}.bulk-name .avatar{width:34px;height:34px;font-size:16px}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:end}.nav-btn{border:0;background:transparent;color:var(--muted);font-size:9px;padding:5px}.nav-btn span{display:block;font-size:20px;margin-bottom:2px}.nav-btn.active{color:var(--navy);font-weight:800}.fab{width:56px;height:56px;border-radius:50%;border:5px solid var(--bg);background:var(--pink);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(236,21,93,.28);justify-self:center;margin-top:-28px}
.overlay{position:fixed;z-index:100;inset:0;background:rgba(10,21,65,.52);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:900px;border-radius:24px 24px 0 0;max-height:94vh;overflow:auto;padding:17px 15px calc(18px + env(safe-area-inset-bottom))}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-head h2{margin:0;font-size:18px;color:var(--navy)}.close{border:0;background:#eef1f9;width:35px;height:35px;border-radius:50%;font-size:18px;color:var(--navy)}.toast{position:fixed;z-index:200;left:50%;bottom:106px;transform:translateX(-50%);background:#17245d;color:#fff;padding:10px 13px;border-radius:12px;font-size:11px}
@media(max-width:560px){.identity-grid,.two.mobile-stack,.three{grid-template-columns:1fr}.status-item{grid-template-columns:auto minmax(0,1fr)}.status-item .action-stack{grid-column:2;justify-items:start}.profile-photo-wrap{flex-direction:column}.photo-preview{width:86px;height:86px}.litter-head{flex-direction:column}.litter-actions{justify-content:flex-start}.bulk-row{grid-template-columns:minmax(0,1fr) 95px}}
@media(max-width:370px){.two{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:90vh}.quick-grid{grid-template-columns:repeat(6,1fr)}.summary-grid{grid-template-columns:repeat(4,1fr)}}
</style>

<body>
<header><div class="header-row"><div class="brand"><small>Action 4 Animals Hawaii</small><strong>🐾 Foster Kitten <span class="brand-accent">Care</span></strong></div><div class="head-actions"><button class="icon-btn" id="backupBtn">⇩ Backup</button><button class="icon-btn" id="settingsBtn">⚙</button></div></div></header>
<main class="container" id="app"></main>
<nav class="bottom-nav"><button class="nav-btn active" data-view="today"><span>🏠</span>Today</button><button class="nav-btn" data-view="kittens"><span>🐱</span>Kittens</button><button class="fab" id="quickFab" aria-label="Quick log">+</button><button class="nav-btn" data-view="alerts"><span>🔔</span>Alerts</button><button class="nav-btn" data-view="handoff"><span>📋</span>Handoff</button></nav>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='a4a-kitten-care-v3';
let state=migrate(loadRaw()),activeView='today',activeKittenId=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadRaw(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){console.error('Storage parse error',e);return null}}
function todayISO(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function migrate(raw){
 const s=raw&&Array.isArray(raw.kittens)&&Array.isArray(raw.events)?raw:{version:4,kittens:[],events:[],litters:[],settings:{fosterName:'Foster Home'}};
 s.version=4;s.settings=s.settings||{fosterName:'Foster Home'};s.events=s.events||[];s.litters=Array.isArray(s.litters)?s.litters:[];
 const byName=new Map(s.litters.map(l=>[(l.name||'').trim().toLowerCase(),l]));
 s.kittens=(s.kittens||[]).map(k=>{k.medications=Array.isArray(k.medications)?k.medications:[];k.photo=k.photo||null;k.status=k.status||'In foster';k.carePlan={feedingEnabled:k.carePlan?.feedingEnabled??true,dailyWeight:k.carePlan?.dailyWeight??true,...(k.carePlan||{})};
   if(!k.litterId&&k.litter){const key=String(k.litter).trim().toLowerCase();if(key){let l=byName.get(key);if(!l){l={id:uid('litter'),name:String(k.litter).trim(),dob:'',intakeDate:'',foster:'',notes:''};s.litters.push(l);byName.set(key,l)}k.litterId=l.id}}
   k.medications=k.medications.map(m=>normalizeMed(m));return k});
 return s;
}
function normalizeMed(m){const out={...m};out.id=out.id||uid('med');out.schedule=out.schedule||{type:out.intervalHours?'intervalHours':'daily',intervalHours:Number(out.intervalHours)||12,times:['08:00']};out.doseCalc=out.doseCalc||{mode:'manual'};out.manualDose=out.manualDose??out.dose??'';out.startDate=out.startDate||(out.startAt?new Date(out.startAt).toISOString().slice(0,10):todayISO());out.endDate=out.endDate||'';out.instructions=out.instructions||'';return out}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function kitten(id){return state.kittens.find(k=>k.id===id)}
function litter(id){return state.litters.find(l=>l.id===id)}
function events(id,type){return state.events.filter(e=>e.kittenId===id&&(!type||e.type===type)&&!e.deletedAt).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function last(id,type){return events(id,type)[0]||null}
function sameDay(a,b){return new Date(a).toDateString()===new Date(b).toDateString()}
function fmtTime(x){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(x))}
function fmtDate(x){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(x))}
function ageText(dob){if(!dob)return'Age unknown';const d=Math.max(0,Math.floor((Date.now()-new Date(dob+'T12:00:00'))/86400000));if(d<14)return`${d} day${d===1?'':'s'} old`;if(d<365)return`${Math.floor(d/7)} wk ${d%7} d`;return`${Math.floor(d/365)} yr ${Math.floor((d%365)/30)} mo`}
function avatar(k,large=false){return `<div class="avatar${large?' large':''}">${k&&k.photo?`<img src="${k.photo}" alt="${esc(k.name)}">`:'🐱'}</div>`}
function latestWeight(k){const e=last(k.id,'weight');return e?Number(e.data.grams):null}
function previousWeight(k){const e=events(k.id,'weight')[1];return e?Number(e.data.grams):null}
function weightDue(k){if(!k.carePlan?.dailyWeight)return false;const e=last(k.id,'weight');return !e||!sameDay(e.ts,new Date())}
function nextFeeding(k){if(!k.carePlan?.feedingEnabled)return null;const e=last(k.id,'feeding');if(!e)return new Date().toISOString();return new Date(new Date(e.ts).getTime()+Number(k.feedingIntervalHours||4)*3600000).toISOString()}
function timeUntil(x){const d=new Date(x)-Date.now(),a=Math.abs(d),h=Math.floor(a/3600000),m=Math.floor((a%3600000)/60000),t=(h?h+'h ':'')+m+'m';return d<0?t+' overdue':'in '+t}
function activeDate(m,date=new Date()){const ymd=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;return (!m.startDate||ymd>=m.startDate)&&(!m.endDate||ymd<=m.endDate)}
function medLogs(k,m){return state.events.filter(e=>e.kittenId===k.id&&e.type==='medication'&&e.data.medId===m.id&&!e.deletedAt).sort((a,b)=>new Date(b.ts)-new Date(a.ts))}
function scheduleLabel(m){const s=m.schedule||{};if(s.type==='prn')return'As needed (PRN)';if(s.type==='oneTime')return`One time ${s.oneTimeAt?fmtDate(s.oneTimeAt)+' '+fmtTime(s.oneTimeAt):''}`;if(s.type==='intervalHours')return`Every ${s.intervalHours||12} hours`;if(s.type==='intervalDays')return`Every ${s.intervalDays||1} day${Number(s.intervalDays||1)===1?'':'s'}`;if(s.type==='specificDays')return`${(s.days||[]).join(', ')||'Selected days'} at ${(s.times||['08:00']).join(', ')}`;if(s.type==='twiceDaily')return`Twice daily · ${(s.times||['08:00','20:00']).join(', ')}`;if(s.type==='threeDaily')return`Three times daily · ${(s.times||['08:00','14:00','20:00']).join(', ')}`;return`Once daily · ${(s.times||['08:00']).join(', ')}`}
function nextMedDue(k,m){
 if(!activeDate(m)||m.schedule?.type==='prn')return null;
 const s=m.schedule||{},logs=medLogs(k,m).filter(e=>e.data.status==='given'),lastGiven=logs[0];
 if(s.type==='oneTime'){const at=s.oneTimeAt?new Date(s.oneTimeAt):null;if(!at||lastGiven)return null;return at.toISOString()}
 if(s.type==='intervalHours'){const base=lastGiven?new Date(lastGiven.ts).getTime():new Date((m.startDate||todayISO())+'T00:00:00').getTime();return new Date(base+Number(s.intervalHours||12)*3600000).toISOString()}
 if(s.type==='intervalDays'){const base=lastGiven?new Date(lastGiven.ts).getTime():new Date((m.startDate||todayISO())+'T08:00:00').getTime()-Number(s.intervalDays||1)*86400000;return new Date(base+Number(s.intervalDays||1)*86400000).toISOString()}
 const times=s.times?.length?s.times:(s.type==='twiceDaily'?['08:00','20:00']:s.type==='threeDaily'?['08:00','14:00','20:00']:['08:00']);
 for(let day=0;day<8;day++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+day);if(s.type==='specificDays'){const key=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];if(!(s.days||[]).includes(key))continue}for(const t of times){const [hh,mm]=t.split(':').map(Number),candidate=new Date(d);candidate.setHours(hh||0,mm||0,0,0);if(candidate>Date.now()||!lastGiven||candidate>new Date(lastGiven.ts))return candidate.toISOString()}}
 return null
}
function doseCalculation(k,m){const dc=m.doseCalc||{mode:'manual'},wg=latestWeight(k);if(dc.mode!=='weightBased'||!wg)return null;const kg=wg/1000,rate=Number(dc.rate)||0;if(!rate)return null;let mg=dc.rateUnit==='mcg/kg'?(rate*kg/1000):(rate*kg),ml=null;const conc=Number(dc.concentration)||0;if(conc>0)ml=mg/conc;return{kg,mg,ml,weightG:wg}}
function medStatus(k,m){const due=nextMedDue(k,m);return{due,overdue:!!due&&new Date(due)<=new Date(),calc:doseCalculation(k,m)}}
function alertsFor(k){const out=[],nf=nextFeeding(k);if(nf&&new Date(nf)<=new Date())out.push({kind:'feeding',level:'warn',text:'Feeding '+timeUntil(nf)});if(weightDue(k))out.push({kind:'weight',level:'neutral',text:'Daily weight not logged'});const w=latestWeight(k),p=previousWeight(k);if(w!=null&&p!=null&&w<p)out.push({kind:'weight',level:'danger',text:`Weight down ${p-w}g from prior entry`});(k.medications||[]).forEach(m=>{const s=medStatus(k,m);if(s.overdue)out.push({kind:'medication',level:'danger',text:`${m.name} ${timeUntil(s.due)}`,med:m})});return out}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),1900)}
function groupLitters(){const map=new Map();state.litters.forEach(l=>map.set(l.id,{l,kids:[]}));state.kittens.filter(k=>['In foster','Medical hold','Available for adoption','Adoption pending'].includes(k.status)).forEach(k=>{if(k.litterId&&map.has(k.litterId))map.get(k.litterId).kids.push(k);else{const id='unassigned';if(!map.has(id))map.set(id,{l:{id,name:'Unassigned litter'},kids:[]});map.get(id).kids.push(k)}});return[...map.values()].filter(x=>x.kids.length).sort((a,b)=>a.l.name.localeCompare(b.l.name))}
function render(){$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));$('#app').innerHTML=activeView==='today'?todayView():activeView==='kittens'?kittensView():activeView==='alerts'?alertsView():activeView==='handoff'?handoffView():profileView(activeKittenId);bind()}
function quickButtons(kid=''){return[['feeding','🍼','Feeding'],['weight','⚖️','Weight'],['medication','💊','Medication'],['potty','🚽','Potty'],['note','📝','Note'],['health','🌡️','Health']].map(x=>`<button class="quick-btn" data-log="${x[0]}" ${kid?`data-kitten="${kid}"`:''}><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}
function todayView(){const active=state.kittens.filter(k=>['In foster','Medical hold','Available for adoption','Adoption pending'].includes(k.status)),feeds=state.events.filter(e=>e.type==='feeding'&&!e.deletedAt&&sameDay(e.ts,new Date())).length,meds=state.events.filter(e=>e.type==='medication'&&!e.deletedAt&&e.data.status==='given'&&sameDay(e.ts,new Date())).length,weights=state.events.filter(e=>e.type==='weight'&&!e.deletedAt&&sameDay(e.ts,new Date())).length;const queue=active.flatMap(k=>alertsFor(k).map(a=>({k,a})));return `<div class="hero"><div><h1>Today</h1><p>${active.length?`Care overview for ${active.length} active kitten${active.length===1?'':'s'}`:'Set up your first foster kitten'}</p></div><div class="date-pill">${new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date())}</div></div><div class="summary-grid"><div class="summary-box"><b>${active.length}</b><span>Active kittens</span></div><div class="summary-box"><b>${feeds}</b><span>Feeds today</span></div><div class="summary-box"><b>${meds}</b><span>Meds given</span></div><div class="summary-box"><b>${weights}</b><span>Weights today</span></div></div><div class="card" style="margin-top:13px"><div class="card-head"><h2>Care queue</h2><span class="subtle">${queue.length} item${queue.length===1?'':'s'}</span></div>${active.length?(queue.length?`<div class="status-list">${queue.map(queueCard).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>Everyone is current</b><p>No overdue care or daily weight reminders.</p></div>`):`<div class="empty"><div class="emoji">🐱</div><b>No active kittens</b><p>Add a kitten to start tracking care.</p><button class="btn primary" data-action="add-kitten">+ Add kitten</button></div>`}</div><div class="card"><div class="card-head"><h2>Quick log</h2><span class="subtle">Fast foster entry</span></div><div class="quick-grid">${quickButtons()}</div></div>${recentCard()}`}
function queueCard({k,a}){return `<div class="status-item">${avatar(k)}<div><h3>${esc(k.name)}</h3><div class="status-line">${esc(a.text)}</div><span class="litter-chip">${esc(litter(k.litterId)?.name||'Unassigned')}</span></div><div class="action-stack">${a.kind==='weight'?`<button class="btn ghost small" data-log="weight" data-kitten="${k.id}">Log</button>`:`<button class="btn ${a.level==='danger'?'primary':'ghost'} small" data-log="${a.kind}" data-kitten="${k.id}" ${a.med?`data-med="${a.med.id}"`:''}>Log</button>`}<button class="btn secondary small" data-open-kitten="${k.id}">Open</button></div></div>`}
function kittensView(){const archived=state.kittens.filter(k=>!['In foster','Medical hold','Available for adoption','Adoption pending'].includes(k.status));return `<div class="hero"><div><h1>Kittens & litters</h1><p>Profiles, care plans, and bulk litter care</p></div><div><button class="btn secondary small" data-action="add-litter">+ Litter</button> <button class="btn primary small" data-action="add-kitten">+ Kitten</button></div></div>${groupLitters().length?groupLitters().map(litterBlock).join(''):`<div class="card"><div class="empty">No active kittens yet.</div></div>`}${archived.length?`<div class="card"><div class="card-head"><h2>Inactive / completed</h2><span class="subtle">${archived.length}</span></div><div class="kitten-grid">${archived.map(kittenTile).join('')}</div></div>`:''}`}
function litterBlock({l,kids}){return `<section class="litter-card"><div class="litter-head"><div><h2>🐾 ${esc(l.name)}</h2><div class="litter-meta">${kids.length} kitten${kids.length===1?'':'s'}${l.dob?' · DOB '+esc(l.dob):''}${l.intakeDate?' · Intake '+esc(l.intakeDate):''}</div></div><div class="litter-actions">${l.id!=='unassigned'?`<button class="btn secondary small" data-edit-litter="${l.id}">Edit litter</button>`:''}<button class="btn ghost small" data-bulk="feeding" data-litter="${l.id}">Feed litter</button><button class="btn ghost small" data-bulk="weight" data-litter="${l.id}">Weigh litter</button></div></div><div class="kitten-grid">${kids.map(kittenTile).join('')}</div></section>`}
function kittenTile(k){const w=latestWeight(k),p=previousWeight(k),change=w!=null&&p!=null?w-p:null;return `<button class="kitten-tile" data-open-kitten="${k.id}"><div class="top">${avatar(k)}<div><h3>${esc(k.name)}</h3><p>${ageText(k.dob||litter(k.litterId)?.dob)}${k.sex?' · '+esc(k.sex):''}</p><span class="status-chip">${esc(k.status)}</span></div></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${change==null?'—':(change>0?'+':'')+change}</b><span>change</span></div><div class="metric"><b>${(k.medications||[]).length}</b><span>meds</span></div></div></button>`}
function weightChart(k){const pts=events(k.id,'weight').slice(0,10).reverse();if(pts.length<2)return`<div class="empty">Log at least two weights to see the trend.</div>`;const vals=pts.map(e=>Number(e.data.grams)),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min),coords=vals.map((v,i)=>`${10+i*(280/(vals.length-1))},${130-((v-min)/range)*105}`).join(' '),lastPt=coords.split(' ').at(-1).split(',');return `<div class="chart-wrap"><svg class="weight-chart" viewBox="0 0 300 145" preserveAspectRatio="none"><line x1="10" y1="130" x2="290" y2="130" stroke="#dfe5f3"/><polyline points="${coords}" fill="none" stroke="#193ca8" stroke-width="3" vector-effect="non-scaling-stroke"/><circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="#ec155d"/></svg><div class="chart-labels"><span>${fmtDate(pts[0].ts)} · ${vals[0]}g</span><span>${fmtDate(pts.at(-1).ts)} · ${vals.at(-1)}g</span></div></div>`}
function profileView(id){const k=kitten(id);if(!k){activeView='kittens';return kittensView()}const l=litter(k.litterId),w=latestWeight(k),p=previousWeight(k),gain=w!=null&&p!=null?w-p:null,meds=k.medications||[];return `<div class="hero"><div><button class="btn secondary small" data-action="back-kittens">← Kittens</button><h1 style="margin-top:10px">${esc(k.name)}</h1><p>${ageText(k.dob||l?.dob)}${k.sex?' · '+esc(k.sex):''}</p><span class="litter-chip">${esc(l?.name||'Unassigned litter')}</span><span class="status-chip">${esc(k.status)}</span></div>${avatar(k,true)}</div><div class="card"><div class="card-head"><h2>At a glance</h2><button class="btn secondary small" data-action="edit-kitten" data-kitten="${k.id}">Edit</button></div><div class="metric-row"><div class="metric"><b>${w??'—'}</b><span>grams</span></div><div class="metric"><b>${gain==null?'—':(gain>0?'+':'')+gain}</b><span>last change</span></div><div class="metric"><b>${k.carePlan?.feedingEnabled?(k.feedingIntervalHours||4)+'h':'Off'}</b><span>feed schedule</span></div></div><div class="quick-grid">${quickButtons(k.id)}</div></div><div class="card"><div class="card-head"><h2>Weight trend</h2><span class="subtle">${events(k.id,'weight').length} entries</span></div>${weightChart(k)}</div><div class="card"><div class="card-head"><h2>Medication plan</h2><button class="btn ghost small" data-action="add-med" data-kitten="${k.id}">+ Medication</button></div>${meds.length?meds.map(m=>medRow(k,m)).join(''):`<div class="empty">No medications assigned.</div>`}</div><div class="card"><div class="card-head"><h2>Care timeline</h2><span class="subtle">Tap Edit to correct an entry</span></div>${events(k.id).length?`<div class="timeline">${events(k.id).slice(0,30).map(eventRow).join('')}</div>`:`<div class="empty">No care events yet.</div>`}</div>`}
function medRow(k,m){const s=medStatus(k,m),calc=s.calc;return `<div class="med-row"><div><h4>💊 ${esc(m.name)}</h4><p>${esc(m.route||'')} · ${esc(scheduleLabel(m))}${m.endDate?' · through '+esc(m.endDate):''}</p>${m.instructions?`<p>${esc(m.instructions)}</p>`:''}<div class="dose-box">${calc?`Latest weight ${calc.weightG}g · prescribed ${esc(m.doseCalc.rate)} ${esc(m.doseCalc.rateUnit)} → <b>${calc.mg.toFixed(3).replace(/\.?0+$/,'')} mg${calc.ml!=null?` = ${calc.ml.toFixed(3).replace(/\.?0+$/,'')} mL at ${esc(m.doseCalc.concentration)} mg/mL`:''}</b>`:`Dose: <b>${esc(m.manualDose||'Not entered')} ${esc(m.unit||'')}</b>`}</div><p>${s.due?`Next ${timeUntil(s.due)}`:m.schedule?.type==='prn'?'PRN — no automatic due time':'No dose currently due'}</p></div><div class="action-stack"><button class="btn ${s.overdue?'primary':'ghost'} small" data-log="medication" data-kitten="${k.id}" data-med="${m.id}">${s.overdue?'Give':'Log'}</button><button class="btn secondary small" data-action="edit-med" data-kitten="${k.id}" data-med="${m.id}">Edit</button></div></div>`}
function recentCard(){const es=[...state.events].filter(e=>!e.deletedAt).sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,8);return `<div class="card"><div class="card-head"><h2>Recent care</h2><span class="subtle">Latest activity</span></div>${es.length?`<div class="timeline">${es.map(eventRow).join('')}</div>`:`<div class="empty">No care logged yet.</div>`}</div>`}
function eventMeta(e){const d=e.data||{};if(e.type==='feeding')return['🍼','Feeding',`${d.amount||''}${d.unit?' '+d.unit:''}${d.food?' · '+d.food:''}${d.note?' · '+d.note:''}`];if(e.type==='weight')return['⚖️','Weight',`${d.grams||''} g${d.note?' · '+d.note:''}`];if(e.type==='medication')return['💊','Medication',`${d.medName||'Medication'} · ${d.status||'given'}${d.adminAmount?' · '+d.adminAmount:''}${d.note?' · '+d.note:''}`];if(e.type==='potty')return['🚽','Potty',`Urine ${d.urine||'—'} · stool ${d.stool||'—'}${d.note?' · '+d.note:''}`];if(e.type==='health')return['🌡️','Health',`${d.temp?d.temp+'°F · ':''}${d.status||''}${d.note?' · '+d.note:''}`];return['📝','Note',d.note||'']}
function eventRow(e){const k=kitten(e.kittenId),m=eventMeta(e);return `<div class="event"><div class="event-icon">${m[0]}</div><div><h4>${esc(k?.name||'Kitten')} · ${esc(m[1])}</h4><p>${esc(m[2])}</p><div class="event-actions"><button class="btn secondary small" data-edit-event="${e.id}">Edit</button><button class="btn danger small" data-delete-event="${e.id}">Delete</button></div></div><time>${sameDay(e.ts,new Date())?fmtTime(e.ts):fmtDate(e.ts)}</time></div>`}
function alertsView(){const all=state.kittens.filter(k=>['In foster','Medical hold','Available for adoption','Adoption pending'].includes(k.status)).flatMap(k=>alertsFor(k).map(a=>({k,a})));return `<div class="hero"><div><h1>Alerts</h1><p>Overdue care and trends needing attention</p></div><div class="date-pill">${all.length} active</div></div><div class="card">${all.length?`<div class="status-list">${all.map(queueCard).join('')}</div>`:`<div class="empty"><div class="emoji">✅</div><b>No active alerts</b></div>`}</div>`}
function handoffView(){const text=groupLitters().map(({l,kids})=>`${l.name}\n${kids.map(k=>{const w=latestWeight(k),f=last(k.id,'feeding'),a=alertsFor(k),meds=(k.medications||[]).map(m=>{const s=medStatus(k,m);return s.due?`${m.name} ${timeUntil(s.due)}`:`${m.name} ${m.schedule?.type==='prn'?'PRN':'not due'}`}).join('; ');return `• ${k.name}: ${w!=null?w+'g':'no weight'}; ${f?'fed '+fmtTime(f.ts):'no feed logged'}${meds?'; meds: '+meds:''}${a.length?'; ALERT: '+a.map(x=>x.text).join(', '):''}`}).join('\n')}`).join('\n\n')||'No active kittens.';return `<div class="hero"><div><h1>Handoff</h1><p>Grouped by litter for foster-to-foster handoff</p></div></div><div class="card"><div class="card-head"><h2>Current handoff</h2><button class="btn primary small" id="copyHandoff">Copy</button></div><div class="handoff" id="handoffText">${esc(text)}</div></div>`}
function bind(){$$('[data-open-kitten]').forEach(x=>x.onclick=e=>{e.stopPropagation();activeKittenId=x.dataset.openKitten;activeView='profile';render()});$$('[data-log]').forEach(x=>x.onclick=e=>{e.stopPropagation();openLog(x.dataset.log,x.dataset.kitten||null,x.dataset.med||null)});$$('[data-action]').forEach(x=>x.onclick=e=>{e.stopPropagation();const a=x.dataset.action;if(a==='add-kitten')openKitten();if(a==='edit-kitten')openKitten(kitten(x.dataset.kitten));if(a==='add-litter')openLitter();if(a==='back-kittens'){activeView='kittens';render()}if(a==='add-med')openMed(kitten(x.dataset.kitten));if(a==='edit-med'){const k=kitten(x.dataset.kitten);openMed(k,(k.medications||[]).find(m=>m.id===x.dataset.med))}});$$('[data-edit-litter]').forEach(x=>x.onclick=()=>openLitter(litter(x.dataset.editLitter)));$$('[data-bulk]').forEach(x=>x.onclick=()=>openBulk(x.dataset.bulk,x.dataset.litter));$$('[data-edit-event]').forEach(x=>x.onclick=()=>openEditEvent(state.events.find(e=>e.id===x.dataset.editEvent)));$$('[data-delete-event]').forEach(x=>x.onclick=()=>deleteEvent(x.dataset.deleteEvent));const c=$('#copyHandoff');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText($('#handoffText').innerText);toast('Handoff copied')}catch(e){toast('Copy not available')}}}
function showSheet(title,body){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" id="closeSheet">×</button></div>${body}</div></div>`;$('#closeSheet').onclick=closeSheet;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()}}

function resizePhoto(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,320,320);resolve(c.toDataURL('image/jpeg',.8))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function openLitter(l=null){showSheet(l?'Edit litter':'Add litter',`<form id="litterForm" class="form-grid"><div class="field"><label>Litter name *</label><input name="name" required value="${esc(l?.name||'')}" placeholder="e.g. Volcano Litter"></div><div class="two mobile-stack"><div class="field"><label>Shared / estimated DOB</label><input type="date" name="dob" value="${l?.dob||''}"></div><div class="field"><label>Intake date</label><input type="date" name="intakeDate" value="${l?.intakeDate||''}"></div></div><div class="field"><label>Foster / location</label><input name="foster" value="${esc(l?.foster||'')}"></div><div class="field"><label>Litter notes</label><textarea name="notes">${esc(l?.notes||'')}</textarea></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save litter</button></div></form>`);$('#cancelForm').onclick=closeSheet;$('#litterForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),obj={id:l?.id||uid('litter'),name:String(f.get('name')).trim(),dob:f.get('dob'),intakeDate:f.get('intakeDate'),foster:String(f.get('foster')).trim(),notes:String(f.get('notes')).trim()};if(l)Object.assign(l,obj);else state.litters.push(obj);save();closeSheet();activeView='kittens';render();toast(l?'Litter updated':'Litter added')}}
function openKitten(k=null){showSheet(k?'Edit kitten':'Add kitten',`<form id="kittenForm" class="form-grid"><div class="profile-photo-wrap"><div class="photo-preview" id="photoPreview">${k?.photo?`<img src="${k.photo}">`:'🐱'}</div><div style="flex:1"><div class="field"><label>Profile picture</label><input type="file" id="photoInput" accept="image/*" capture="environment"></div><div class="photo-help">Photo is resized before browser storage.</div>${k?.photo?'<button type="button" class="btn secondary small" id="removePhoto" style="margin-top:7px">Remove photo</button>':''}</div></div><div class="field"><label>Name *</label><input name="name" required value="${esc(k?.name||'')}"></div><div class="identity-grid"><div class="field"><label>Litter</label><select name="litterId"><option value="">Unassigned</option>${state.litters.map(l=>`<option value="${l.id}" ${k?.litterId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['In foster','Medical hold','Available for adoption','Adoption pending','Adopted','Transferred','Returned to A4A','Deceased'].map(s=>`<option ${k?.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="identity-grid"><div class="field"><label>Date of birth (override)</label><input type="date" name="dob" value="${k?.dob||''}"></div><div class="field"><label>Sex</label><select name="sex"><option value="">Unknown</option><option ${k?.sex==='Female'?'selected':''}>Female</option><option ${k?.sex==='Male'?'selected':''}>Male</option></select></div></div><div class="two mobile-stack"><div class="field"><label>Intake date</label><input type="date" name="intakeDate" value="${k?.intakeDate||''}"></div><div class="field"><label>A4A / Shelter ID</label><input name="shelterId" value="${esc(k?.shelterId||'')}"></div></div><div class="two mobile-stack"><div class="field"><label>Color / markings</label><input name="markings" value="${esc(k?.markings||'')} atus'),dob:f.get('dob'),sex:f.get('sex'),intakeDate:f.get('intakeDate'),shelterId:String(f.get('shelterId')).trim(),markings:String(f.get('markings')).trim(),microchip:String(f.get('microchip')).trim(),specialNeeds:String(f.get('specialNeeds')).trim(),intakeWeight:iw,feedingIntervalHours:interval,medications:k?.medications||[],photo,carePlan:{feedingEnabled:f.get('feedingEnabled')==='on',dailyWeight:f.get('dailyWeight')==='on'}};if(k)Object.assign(k,obj);else{state.kittens.push(obj);if(iw)state.events.push({id:uid('evt'),kittenId:id,type:'weight',ts:new Date().toISOString(),createdAt:new Date().toISOString(),data:{grams:iw,note:'Intake weight'}})}save();closeSheet();activeKittenId=id;activeView='profile';render();toast(k?'Kitten updated':'Kitten added')};if(k)$('#deleteKitten').onclick=()=>{if(confirm(`Remove ${k.name} and all local care logs?`)){state.kittens=state.kittens.filter(x=>x.id!==k.id);state.events=state.events.filter(x=>x.kittenId!==k.id);save();closeSheet();activeView='kittens';render();toast('Kitten removed')}}}
function scheduleFields(m){const s=m?.schedule||{type:'daily',times:['08:00']},type=s.type||'daily';return `<div class="field"><label>Frequency</label><select name="scheduleType" id="scheduleType"><option value="daily" ${type==='daily'?'selected':''}>Once daily</option><option value="twiceDaily" ${type==='twiceDaily'?'selected':''}>Twice daily</option><option value="threeDaily" ${type==='threeDaily'?'selected':''}>Three times daily</option><option value="intervalHours" ${type==='intervalHours'?'selected':''}>Every X hours</option><option value="intervalDays" ${type==='intervalDays'?'selected':''}>Every X days</option><option value="specificDays" ${type==='specificDays'?'selected':''}>Specific days of week</option><option value="oneTime" ${type==='oneTime'?'selected':''}>One-time dose</option><option value="prn" ${type==='prn'?'selected':''}>As needed (PRN)</option></select></div><div id="scheduleExtra"></div>`}
function scheduleExtraHTML(type,s={}){if(type==='daily')return`<div class="field"><label>Time</label><input type="time" name="time1" value="${s.times?.[0]||'08:00'}"></div>`;if(type==='twiceDaily')return`<div class="two"><div class="field"><label>Time 1</label><input type="time" name="time1" value="${s.times?.[0]||'08:00'}"></div><div class="field"><label>Time 2</label><input type="time" name="time2" value="${s.times?.[1]||'20:00'}"></div></div>`;if(type==='threeDaily')return`<div class="three"><div class="field"><label>Time 1</label><input type="time" name="time1" value="${s.times?.[0]||'08:00'}"></div><div class="field"><label>Time 2</label><input type="time" name="time2" value="${s.times?.[1]||'14:00'}"></div><div class="field"><label>Time 3</label><input type="time" name="time3" value="${s.times?.[2]||'20:00'}"></div></div>`;if(type==='intervalHours')return`<div class="field"><label>Every how many hours?</label><input type="number" min="1" max="168" name="intervalHours" value="${s.intervalHours||12}"></div>`;if(type==='intervalDays')return`<div class="field"><label>Every how many days?</label><input type="number" min="1" max="90" name="intervalDays" value="${s.intervalDays||1}"></div>`;if(type==='specificDays')return`<div class="field"><label>Days</label><div>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<label class="field-check" style="display:inline-flex;margin:4px 10px 4px 0"><input type="checkbox" name="day" value="${d}" ${(s.days||[]).includes(d)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="field"><label>Time</label><input type="time" name="time1" value="${s.times?.[0]||'08:00'}"></div>`;if(type==='oneTime')return`<div class="field"><label>One-time date & time</label><input type="datetime-local" name="oneTimeAt" value="${s.oneTimeAt?new Date(new Date(s.oneTimeAt)-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16):''}"></div>`;return`<div class="info">PRN medications do not generate automatic overdue alerts. Log each administration when given.</div>`}
function doseFields(m){const dc=m?.doseCalc||{mode:'manual'};return `<div class="field"><label>Dose entry</label><select name="doseMode" id="doseMode"><option value="manual" ${dc.mode!=='weightBased'?'selected':''}>Manual prescribed amount</option><option value="weightBased" ${dc.mode==='weightBased'?'selected':''}>Weight-based prescribed rate</option></select></div><div id="doseExtra"></div>`}
function doseExtraHTML(mode,m){const dc=m?.doseCalc||{};if(mode==='weightBased')return`<div class="notice">Enter only the rate provided by A4A/veterinary instructions. The app calculates arithmetic; it does not choose a dose.</div><div class="two mobile-stack"><div class="field"><label>Prescribed rate</label><input type="number" step="0.001" min="0" name="rate" value="${dc.rate||''}" placeholder="10"></div><div class="field"><label>Rate unit</label><select name="rateUnit"><option ${dc.rateUnit==='mg/kg'?'selected':''}>mg/kg</option><option ${dc.rateUnit==='mcg/kg'?'selected':''}>mcg/kg</option></select></div></div><div class="two mobile-stack"><div class="field"><label>Liquid concentration (mg/mL)</label><input type="number" step="0.001" min="0" name="concentration" value="${dc.concentration||''}" placeholder="Optional"></div><div class="field"><label>Administration unit</label><select name="unit"><option>mL</option><option>mg</option></select></div></div><div class="calc-result" id="calcPreview">Calculation will use the kitten's latest recorded weight.</div>`;return`<div class="two mobile-stack"><div class="field"><label>Prescribed amount</label><input name="manualDose" value="${esc(m?.manualDose||'')}" placeholder="0.4"></div><div class="field"><label>Unit</label><select name="unit">${['mL','mg','tablet','drop','other'].map(x=>`<option ${m?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`}
function openMed(k,m=null){if(!k)return;showSheet(m?'Edit medication':'Add medication',`<form id="medForm" class="form-grid"><div class="field"><label>Medication *</label><input name="name" required value="${esc(m?.name||'')}"></div><div class="two mobile-stack"><div class="field"><label>Route</label><select name="route">${['Oral','Topical','Eye','Ear','Injection','Other'].map(x=>`<option ${m?.route===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Prescribed by / source</label><input name="source" value="${esc(m?.source||'A4A / veterinarian')}"></div></div>${doseFields(m)}${scheduleFields(m)}<div class="two mobile-stack"><div class="field"><label>Start date</label><input type="date" name="startDate" value="${m?.startDate||todayISO()}"></div><div class="field"><label>End date (optional)</label><input type="date" name="endDate" value="${m?.endDate||''}"></div></div><div class="field"><label>Instructions / notes</label><textarea name="instructions">${esc(m?.instructions||'')}</textarea></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save medication</button></div>${m?'<div class="danger-zone"><button type="button" class="btn danger" id="deleteMed">Remove medication</button></div>':''}</form>`);const st=m?.schedule?.type||'daily',dm=m?.doseCalc?.mode||'manual';$('#scheduleExtra').innerHTML=scheduleExtraHTML(st,m?.schedule);$('#doseExtra').innerHTML=doseExtraHTML(dm,m);$('#scheduleType').onchange=e=>$('#scheduleExtra').innerHTML=scheduleExtraHTML(e.target.value,m?.schedule);$('#doseMode').onchange=e=>{$('#doseExtra').innerHTML=doseExtraHTML(e.target.value,m);bindCalcPreview()};function bindCalcPreview(){const rate=$('[name=rate]'),conc=$('[name=concentration]'),preview=$('#calcPreview');if(!rate||!preview)return;const update=()=>{const w=latestWeight(k),r=Number(rate.value)||0,c=Number(conc?.value)||0,unit=$('[name=rateUnit]')?.value||'mg/kg';if(!w||!r){preview.textContent='Add a current weight and prescribed rate to calculate.';return}const kg=w/1000,mg=unit==='mcg/kg'?r*kg/1000:r*kg;preview.textContent=`Using ${w}g: ${mg.toFixed(3).replace(/\.?0+$/,'')} mg${c>0?' = '+(mg/c).toFixed(3).replace(/\.?0+$/,'')+' mL at '+c+' mg/mL':''}`};rate.oninput=update;if(conc)conc.oninput=update;update()}bindCalcPreview();$('#cancelForm').onclick=closeSheet;$('#medForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),start=f.get('startDate'),end=f.get('endDate');if(end&&start&&end<start){alert('End date cannot be before the start date.');return}const type=f.get('scheduleType'),schedule={type};if(['daily','twiceDaily','threeDaily'].includes(type)){schedule.times=[f.get('time1'),f.get('time2'),f.get('time3')].filter(Boolean)}if(type==='intervalHours')schedule.intervalHours=Number(f.get('intervalHours'))||12;if(type==='intervalDays')schedule.intervalDays=Number(f.get('intervalDays'))||1;if(type==='specificDays'){schedule.days=f.getAll('day');schedule.times=[f.get('time1')||'08:00'];if(!schedule.days.length){alert('Choose at least one day of the week.');return}}if(type==='oneTime'){if(!f.get('oneTimeAt')){alert('Choose the one-time date and time.');return}schedule.oneTimeAt=new Date(f.get('oneTimeAt')).toISOString()}const mode=f.get('doseMode'),doseCalc=mode==='weightBased'?{mode,rate:Number(f.get('rate'))||0,rateUnit:f.get('rateUnit'),concentration:Number(f.get('concentration'))||null}:{mode:'manual'};if(mode==='weightBased'&&!doseCalc.rate){alert('Enter the prescribed weight-based rate.');return}const obj={id:m?.id||uid('med'),name:String(f.get('name')).trim(),route:f.get('route'),source:String(f.get('source')).trim(),manualDose:String(f.get('manualDose')||'').trim(),unit:f.get('unit')||'',doseCalc,schedule,startDate:start,endDate:end,instructions:String(f.get('instructions')).trim()};if(m)Object.assign(m,obj);else k.medications.push(obj);save();closeSheet();render();toast(m?'Medication updated':'Medication added')};if(m)$('#deleteMed').onclick=()=>{if(confirm('Remove this medication plan?')){k.medications=k.medications.filter(x=>x.id!==m.id);save();closeSheet();render();toast('Medication removed')}}}
function openBulk(type,litterId){const activeStatuses=['In foster','Medical hold','Available for adoption','Adoption pending'];const kids=litterId==='unassigned'?state.kittens.filter(k=>!k.litterId&&activeStatuses.includes(k.status)):state.kittens.filter(k=>k.litterId===litterId&&activeStatuses.includes(k.status));if(!kids.length)return;const l=litter(litterId)||{name:'Unassigned litter'};if(type==='weight'){showSheet(`Weigh ${l.name}`,`<form id="bulkForm" class="form-grid"><div class="info">Enter only the kittens weighed now. Blank rows will be skipped.</div>${kids.map(k=>`<div class="bulk-row"><div class="bulk-name">${avatar(k)}<div><b>${esc(k.name)}</b><div class="subtle">Last: ${latestWeight(k)??'—'}g</div></div></div><div class="field"><input type="number" min="1" max="12000" name="w_${k.id}" placeholder="grams"></div></div>`).join('')}<div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save weights</button></div></form>`)}else{showSheet(`Feed ${l.name}`,`<form id="bulkForm" class="form-grid"><div class="two mobile-stack"><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div><div class="field"><label>Food</label><input name="food" placeholder="KMR, wet food..."></div></div>${kids.map(k=>`<div class="bulk-row"><div class="bulk-name">${avatar(k)}<div><b>${esc(k.name)}</b></div></div><div class="field"><input inputmode="decimal" name="a_${k.id}" placeholder="amount"></div></div>`).join('')}<div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save feedings</button></div></form>`)}$('#cancelForm').onclick=closeSheet;$('#bulkForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),ts=new Date().toISOString();let count=0;kids.forEach(k=>{const v=f.get((type==='weight'?'w_':'a_')+k.id);if(v!==''&&v!=null){if(type==='weight'){const grams=Number(v);state.events.push({id:uid('evt'),kittenId:k.id,type:'weight',ts,createdAt:ts,data:{grams,note:'Bulk litter weight'}})}else state.events.push({id:uid('evt'),kittenId:k.id,type:'feeding',ts,createdAt:ts,data:{amount:v,unit:f.get('unit'),food:f.get('food'),note:'Bulk litter feeding'}});count++}});if(!count){toast('Nothing entered');return}save();closeSheet();render();toast(`${count} ${type==='weight'?'weights':'feedings'} saved`)}}
function logFields(type,k,medId){if(type==='feeding')return`<div class="two"><div class="field"><label>Amount</label><input name="amount" inputmode="decimal"></div><div class="field"><label>Unit</label><select name="unit"><option>mL</option><option>g</option><option>oz</option></select></div></div><div class="field"><label>Food</label><input name="food"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='weight')return`<div class="field"><label>Weight (grams) *</label><input type="number" min="1" max="12000" name="grams" required value="${latestWeight(k)||''}"></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='medication'){if(!(k.medications||[]).length)return`<div class="notice">Add a medication plan to ${esc(k.name)} first.</div><input type="hidden" name="noMed" value="1">`;const opts=k.medications.map(m=>`<option value="${m.id}" ${m.id===medId?'selected':''}>${esc(m.name)} · ${esc(scheduleLabel(m))}</option>`).join('');const m=(k.medications||[]).find(x=>x.id===(medId||k.medications[0].id))||k.medications[0],calc=doseCalculation(k,m);return`<div class="field"><label>Medication</label><select name="medId" id="logMedId">${opts}</select></div><div class="calc-result">${calc?`Current calculation: ${calc.mg.toFixed(3).replace(/\.?0+$/,'')} mg${calc.ml!=null?' = '+calc.ml.toFixed(3).replace(/\.?0+$/,'')+' mL':''}`:`Prescribed amount: ${esc(m.manualDose||'not entered')} ${esc(m.unit||'')}`}</div><div class="two mobile-stack"><div class="field"><label>Status</label><select name="status"><option value="given">Given</option><option value="skipped">Skipped</option><option value="unable">Unable to give</option></select></div><div class="field"><label>Actual amount given</label><input name="adminAmount" placeholder="e.g. 0.4 mL"></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`}if(type==='potty')return`<div class="two"><div class="field"><label>Urine</label><select name="urine"><option>yes</option><option>no</option><option>unknown</option></select></div><div class="field"><label>Stool</label><select name="stool"><option>Normal</option><option>Soft</option><option>Diarrhea</option><option>Hard</option><option>Abnormal color</option><option>Not observed</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;if(type==='health')return`<div class="two mobile-stack"><div class="field"><label>Temperature °F</label><input name="temp" inputmode="decimal"></div><div class="field"><label>Status</label><select name="status"><option>Normal</option><option>Monitor</option><option>Concern</option></select></div></div><div class="field"><label>Notes</label><textarea name="note"></textarea></div>`;return`<div class="field"><label>Care note *</label><textarea name="note" required></textarea></div>`}
function openLog(type,kid=null,medId=null){if(!state.kittens.length)return openKitten();const selected=kid||activeKittenId||state.kittens[0].id;showSheet('Log '+type,`<form id="logForm" class="form-grid"><div class="field"><label>Kitten</label><select name="kittenId" id="logKitten">${state.kittens.map(k=>`<option value="${k.id}" ${k.id===selected?'selected':''}>${esc(k.name)} — ${esc(litter(k.litterId)?.name||'Unassigned')}</option>`).join('')}</select></div><div id="typeFields"></div><div class="field"><label>Date & time</label><input type="datetime-local" name="when" value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save log</button></div></form>`);const refresh=(mid=medId)=>{$('#typeFields').innerHTML=logFields(type,kitten($('#logKitten').value),mid);if(type==='medication'&&$('#logMedId'))$('#logMedId').onchange=()=>refresh($('#logMedId').value)};refresh();$('#logKitten').onchange=()=>refresh(null);$('#cancelForm').onclick=closeSheet;$('#logForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);if(f.get('noMed'))return toast('Add medication plan first');const k=kitten(f.get('kittenId')),when=f.get('when'),ts=when?new Date(when).toISOString():new Date().toISOString();if(new Date(ts)>new Date(Date.now()+15*60000)&&!confirm('This log is in the future. Save it anyway?'))return;const data={};for(const [key,val] of f.entries())if(!['kittenId','when'].includes(key))data[key]=val;if(type==='weight'){data.grams=Number(data.grams);if(data.grams>12000&&!confirm(`${data.grams}g looks unusually high. Save anyway?`))return}if(type==='medication'){const m=k.medications.find(x=>x.id===data.medId);data.medName=m?.name||'Medication'}const now=new Date().toISOString();state.events.push({id:uid('evt'),kittenId:k.id,type,ts,createdAt:now,updatedAt:now,data});save();closeSheet();render();toast('Care log saved')}}
function openEditEvent(e){if(!e)return;const k=kitten(e.kittenId),d=e.data||{},fields=e.type==='weight'?`<div class="field"><label>Weight (grams)</label><input type="number" min="1" max="12000" name="grams" value="${d.grams||''}"></div><div class="field"><label>Notes</label><textarea name="note">${esc(d.note||'')}</textarea></div>`:e.type==='feeding'?`<div class="two"><div class="field"><label>Amount</label><input name="amount" value="${esc(d.amount||'')}"></div><div class="field"><label>Unit</label><select name="unit">${['mL','g','oz'].map(x=>`<option ${d.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Food</label><input name="food" value="${esc(d.food||'')}"></div><div class="field"><label>Notes</label><textarea name="note">${esc(d.note||'')}</textarea></div>`:`<div class="field"><label>Notes / correction</label><textarea name="note">${esc(d.note||'')}</textarea></div>`;showSheet(`Edit ${e.type} · ${esc(k?.name||'kitten')}`,`<form id="editEventForm" class="form-grid">${fields}<div class="field"><label>Date & time</label><input type="datetime-local" name="when" value="${new Date(new Date(e.ts)-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div><div class="sheet-actions"><button type="button" class="btn secondary" id="cancelForm">Cancel</button><button class="btn primary">Save correction</button></div></form>`);$('#cancelForm').onclick=closeSheet;$('#editEventForm').onsubmit=x=>{x.preventDefault();const f=new FormData(x.currentTarget);for(const [key,val]of f.entries())if(key!=='when')e.data[key]=key==='grams'?Number(val):val;e.ts=new Date(f.get('when')).toISOString();e.updatedAt=new Date().toISOString();save();closeSheet();render();toast('Care log updated')}}
function deleteEvent(id){const e=state.events.find(x=>x.id===id);if(e&&confirm('Delete this care entry? It will be hidden but retained in the local audit data.')){e.deletedAt=new Date().toISOString();e.updatedAt=e.deletedAt;save();render();toast('Care entry deleted')}}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='a4a-kitten-care-v4-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function settings(){showSheet('Settings & data',`<div class="info">V3 prototype data stays in this browser. Backups include kitten photos, litter records, medication plans, and care history.</div><div class="form-grid"><button class="btn secondary" id="restoreBtn">Restore JSON backup</button><input type="file" class="hidden" id="restoreInput" accept="application/json"><div class="danger-zone"><button class="btn danger" id="clearBtn">Clear all V3 data</button></div></div>`);$('#restoreBtn').onclick=()=>$('#restoreInput').click();$('#restoreInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!Array.isArray(parsed.kittens)||!Array.isArray(parsed.events))throw Error('invalid');state=migrate(parsed);save();closeSheet();activeView='today';render();toast('Backup restored')}catch(err){alert('That is not a valid kitten tracker backup.')}};r.readAsText(file)};$('#clearBtn').onclick=()=>{if(confirm('Clear all V3 kitten, litter, medication, photo, and care data from this browser?')){state=migrate(null);save();closeSheet();activeView='today';render();toast('All V3 data cleared')}}}
$$('.nav-btn').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});$('#quickFab').onclick=()=>openLog('feeding');$('#backupBtn').onclick=backup;$('#settingsBtn').onclick=settings;save();render();
})();
